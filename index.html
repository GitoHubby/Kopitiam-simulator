<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malaysian Kopitiam Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: cozy, nostalgic, a little cheeky; Manglish flavour in the copy.
IDEA: the game housing is the kopitiam itself: a wooden shop beam above, the stainless drink counter beside, paper order slips on a rail.
PICTURE: a living top-down kopitiam scene on canvas (checker tiles, marble tables, fans, street outside).
COLOUR and TYPE: kopi brown housing, cream paper, vintage green and muted red accents, warm yellow highlight; Alfa Slab One like old signboards + Baloo 2 for friendly UI.
LAYOUT: scene left, drink station column right on wide screens; stacked scene, then station below 1000px.
*/
:root{color-scheme:dark;--bg:#24160d;--wood:#5b3620;--wood2:#7a4b2a;--cream:#f6ecd4;--paper:#fbf4e2;--ink:#2a1a0f;--muted:#8a7458;--green:#2f5d4e;--green2:#5f8366;--red:#b33f2f;--yellow:#f0b429;--orange:#e07b2e;--steel:#d6dbd8;--steel2:#b7bebb}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--cream);font:16px/1.45 "Baloo 2",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
kbd{font:600 11px "Baloo 2",sans-serif;background:rgba(0,0,0,.12);border-radius:4px;padding:0 4px;margin-left:4px}
#app{min-height:100vh;display:flex;flex-direction:column}
/* HUD: the shop beam */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px max(2vw,12px);background:var(--wood);border-bottom:4px solid #3c2314;box-shadow:inset 0 -2px 0 rgba(255,255,255,.08)}
.brand{font:400 18px/1 "Alfa Slab One",Georgia,serif;color:var(--yellow);letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--cream)}
.hstat{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.hstat .lbl{font-size:12px;color:#e2cfa6}
.hstat b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
#hShift{font-weight:700;font-size:15px;color:var(--cream);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;width:110px;height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#5fbf72;border-radius:6px;transition:width .4s}
.bar i.mid{background:var(--yellow)}.bar i.low{background:#e0553f}
#hWx{font-size:13px;color:#e2cfa6}
.hbtns{margin-left:auto;display:flex;gap:8px}
.ib{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 14px;min-height:36px;font-size:14px;font-weight:600}
#app:not(.ingame) #bPause{visibility:hidden}
/* play area */
#play{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px 372px;grid-template-areas:"stage stage prep" "rail tray prep";grid-template-rows:auto 1fr;align-items:stretch}
#stage{grid-area:stage;position:relative;display:flex;justify-content:center;background:#1b110a;padding:8px 8px 6px}
#railSec{grid-area:rail;background:var(--steel);color:var(--ink);padding:8px 12px 10px;border-top:5px solid var(--wood2)}
#traySec{grid-area:tray;background:#cdd3d0;color:var(--ink);padding:8px 12px 10px;border-top:5px solid var(--wood2);border-left:2px solid #b2bab6}
#prepSec{grid-area:prep;background:var(--steel);color:var(--ink);border-left:6px solid var(--wood2);padding:10px 12px 70px;overflow-y:auto;max-height:calc(100vh - var(--hudh,58px));position:sticky;top:0}
#view{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#cv{display:block;touch-action:none;cursor:grab}
#ovl{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden}
#ovl>div{position:absolute;left:0;top:0}
.tnum{width:24px;height:24px;border-radius:50%;background:#2f5d4e;color:#f8f0dc;font:800 12px/20px "Baloo 2",sans-serif;text-align:center;border:2px solid #f2e6c8;opacity:.92}
.tnum.hl{background:var(--yellow);color:var(--ink);border-color:#fff;box-shadow:0 0 0 5px rgba(240,180,41,.45);opacity:1;z-index:2}
.obub{display:flex;gap:3px;z-index:3}
.ob{display:flex;flex-direction:column;align-items:center;background:#fffaf0;border:2px solid var(--pc,#5a4632);border-radius:10px;padding:2px 3px 3px;box-shadow:0 3px 8px rgba(0,0,0,.3);min-width:30px}
.ob svg{display:block}.ob b{font:800 15px/22px "Baloo 2",sans-serif;color:#5a4632;padding:0 6px}
.ob i{display:block;height:4px;border-radius:2px;align-self:flex-start}
.ob.srv{border-style:dashed}
.wbub span{display:block;background:#fff3d6;border:1px dashed #8a6d3b;border-radius:8px;font:700 11px/1.2 "Baloo 2",sans-serif;padding:2px 7px;color:#5a4632;white-space:nowrap}
.say{background:#2a1d14;color:#fbf3df;font:600 12px/1.2 "Baloo 2",sans-serif;padding:3px 8px;border-radius:9px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;z-index:4}
.say.staff{background:#2f5d4e}
.bname{background:rgba(42,29,20,.85);color:#f7f1e2;font:700 11px/1.3 "Baloo 2",sans-serif;padding:1px 8px;border-radius:8px;white-space:nowrap}.bname.me{color:#ffd166}
.float{font:800 15px/1 "Baloo 2",sans-serif;white-space:nowrap;text-shadow:0 0 3px #1b110a,0 0 3px #1b110a,0 2px 3px #1b110a;z-index:5}.float.g{color:#7ee08a}.float.r{color:#ff7a66}.float.y{color:#ffd166}
#camBtns{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:2}
#camBtns button{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(27,17,10,.6);color:#f6ecd4;font-size:13px;font-weight:700}
#camBtns button.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.nogl{position:absolute;inset:auto 0 40%;text-align:center;color:var(--cream);font-weight:700}
#railSec.flash{animation:railflash .9s}
@keyframes railflash{0%{background:#ffe7a3}100%{background:var(--steel)}}
.tt.go{color:#2f6e46}
#outList{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px;font-weight:700;color:#5a4a36}
#outList em{font-style:normal;background:#eef0ee;border-radius:6px;padding:0 6px}
#tip{position:absolute;z-index:3;pointer-events:none;background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.3;max-width:220px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#tip span{color:var(--muted)}#tip .tl{margin-top:4px;font-weight:700}#tip em{font-style:normal;font-weight:500;color:var(--muted);display:block}
#banner{position:absolute;left:50%;top:18px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:var(--red);color:#fff7e6;font:400 17px/1.2 "Alfa Slab One",serif;padding:10px 20px;border-radius:10px;border:2px solid var(--yellow);box-shadow:0 8px 22px rgba(0,0,0,.4);text-align:center;max-width:90%;z-index:2}
#banner.on{animation:ban 3.2s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
#hint{position:fixed;pointer-events:none;left:50%;bottom:14px;transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:min(680px,92vw);text-align:center;z-index:4}
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:6px}
.st-head h2{font:400 16px/1 "Alfa Slab One",serif;margin:0;color:var(--green)}
#railCount{font-size:13px;color:#5a4a36;font-weight:700}
#bBook{margin-left:auto;background:#c43d2f;color:#fff6e4;border:0;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;min-height:34px}
#book{background:var(--paper);border-radius:8px;padding:8px 12px;font-size:14px;border-left:5px solid #c43d2f;margin-bottom:6px}
#book h3{margin:0 0 4px;font-size:15px}#book ul{margin:0;padding-left:18px}#book span{color:var(--muted);font-size:13px}
#rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:158px;align-items:flex-start;border-top:3px solid #9aa19e}
#rail .empty{margin:12px 4px;color:#5a4a36;font-size:14px}
.tk{flex:none;width:150px;text-align:left;background:var(--paper);color:var(--ink);border:0;border-top:7px solid var(--red);border-radius:3px 3px 8px 8px;padding:7px 8px 8px;box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:3px;position:relative;transition:transform .15s}
.tk:hover{transform:translateY(-2px)}
.tk.mine{outline:3px solid var(--yellow);transform:translateY(-3px)}
.tk.serve::after{content:"Serve to this table";position:absolute;inset:auto 6px 6px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:800;text-align:center;border-radius:6px;padding:2px}
.tk.claimed{border-top-color:var(--pc,#888)}
.tk-top{display:flex;align-items:center;gap:6px}
.tbl{font:400 18px/1 "Alfa Slab One",serif;color:var(--red)}
.who{font-size:11px;line-height:1.1;color:#6b5a44;font-weight:600}.who em{display:block;font-style:normal;color:var(--green);font-weight:700}
.nm{font-weight:800;font-size:15px;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;background:#ece1c6;color:#5a4632}
.chip.ice{background:#d6ecf2;color:#1f5c70}.chip.hot{background:#f6d8c8;color:#8a3416}.chip.sugar{background:#efe5c9}
.note{margin:0;font-size:11px;line-height:1.2;color:#6b5a44}
.pat{display:block;height:6px;background:#e3d8c0;border-radius:4px;overflow:hidden;margin-top:2px}
.pat i{display:block;height:100%;background:#3f9b5a;border-radius:4px}.pat i.mid{background:#e0a020}.pat i.low{background:#d6452f}
.stt{font-size:11px;font-weight:700;color:#fff;background:var(--pc,var(--green));border-radius:4px;padding:0 6px;align-self:flex-start}
#prep{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px}
#cupBox{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
#cupBox.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#cupName{font-weight:800;font-size:13px;line-height:1.15}
#tgtLine{font-size:14px;color:#5a4a36;align-self:center}
#ctrl{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:4px}
.rl{flex-basis:100%;font-size:12px;font-weight:700;color:#5a4a36;line-height:1}
.row button{flex:1 1 0;min-height:42px;padding:2px 4px;border-radius:8px;border:2px solid #b9ad94;background:#fbf7ec;color:var(--ink);font-size:14px;font-weight:700;line-height:1.05}
.row button small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.row button.on{background:var(--green);border-color:var(--green);color:#fff}.row button.on small{color:#cfe3d8}
.row button.fb-good{animation:good .6s}.row button.fb-bad{animation:bad .6s}
@keyframes good{0%{box-shadow:0 0 0 0 rgba(63,155,90,.9)}100%{box-shadow:0 0 0 10px rgba(63,155,90,0)}}
@keyframes bad{0%,100%{transform:none}20%{transform:translateX(-4px);background:#f3c2b6}60%{transform:translateX(4px)}}
#prepMsg{grid-column:1 / -1;min-height:20px;font-size:13px;font-weight:700}
#prepMsg.bad{color:#b3261e}#prepMsg.good{color:#2f6e46}
.acts{grid-column:1 / -1;display:flex;gap:8px}
#bDump{flex:1;min-height:48px;border-radius:10px;border:2px solid #b9ad94;background:#f4eee0;font-weight:700}
#bBrew{flex:2;min-height:48px;border-radius:10px;border:0;background:var(--red);color:#fff6e4;font:400 18px/1 "Alfa Slab One",serif;box-shadow:0 3px 0 #7d2a20}
#bBrew:active{transform:translateY(2px);box-shadow:0 1px 0 #7d2a20}
#slots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.slot{flex:1 1 90px;min-height:46px;background:#bfc6c2;border:2px dashed #a2aaa6;border-radius:10px;display:flex;align-items:center;gap:6px;padding:2px 8px;font-size:12px;font-weight:700;color:#4f5955;position:relative;overflow:hidden;line-height:1.1}
.slot.busy{border-style:solid;background:#eef0ee;color:var(--ink)}
.slot svg{flex:none}
.slot .pg{position:absolute;left:0;bottom:0;right:0;height:5px;background:#d5d0c2}.slot .pg i{display:block;height:100%;width:0;background:var(--orange)}
#tray{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#8a5a34;border-radius:12px;box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}
.tcup{position:relative;width:70px}
.tcup.empty{height:86px;border-radius:10px;background:rgba(0,0,0,.14)}
.tc-main{width:70px;min-height:86px;border-radius:10px;border:2px solid transparent;background:#f8f1df;display:flex;flex-direction:column;align-items:center;padding:2px 2px 4px;line-height:1.05;color:var(--ink)}
.tcup.sel .tc-main{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(240,180,41,.7);transform:translateY(-4px)}
.tcup.fly{opacity:.35}
.tn{font-size:10.5px;font-weight:800;text-align:center}.tt{font-size:10px;color:var(--muted);font-weight:700}
.bin{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#4b3a2b;color:#fff;font-size:14px;line-height:1}
#trayNote{font-size:12px;color:#7a3a10;font-weight:700;margin:0;line-height:1.1;flex-basis:100%}
/* overlay screens */
#ov{position:fixed;inset:0;z-index:10;background:rgba(27,17,10,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#ov[hidden]{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:clamp(18px,3vw,32px);width:min(640px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);border-top:10px solid var(--red)}
.card.title{border-top-color:var(--green);text-align:center}
.card h1{font:400 clamp(30px,5vw,46px)/1.05 "Alfa Slab One",Georgia,serif;margin:4px 0 10px;color:var(--red);text-wrap:balance}
.card h2{font:400 clamp(22px,3.4vw,32px)/1.1 "Alfa Slab One",Georgia,serif;margin:4px 0 10px;color:var(--green);text-wrap:balance}
.card h3{margin:0 0 4px;font-size:17px}
.kicker{margin:0;font-weight:700;color:var(--orange);font-size:15px}
.lede{font-size:17px;margin:0 0 14px;max-width:60ch}
.card.title .lede{margin-inline:auto}
.meta{font-size:14px;color:var(--muted);margin:10px 0 0}
.warn{background:#fbe2d8;color:#7d2a20;border-radius:8px;padding:8px 12px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.card.title .btns{justify-content:center}
.btns button{min-height:44px;padding:6px 18px;border-radius:10px;border:2px solid #c9b994;background:#fff9ea;font-weight:700}
.btns button.big{background:var(--red);color:#fff6e4;border-color:var(--red);font:400 18px/1 "Alfa Slab One",serif;padding:10px 22px;box-shadow:0 3px 0 #7d2a20}
.btns button.big.alt{background:var(--green);border-color:var(--green);box-shadow:0 3px 0 #1d3b31}
.btns.small button{min-height:40px}
.link{background:none;border:0;color:var(--green);text-decoration:underline;padding:0;font-weight:600;min-height:auto}
.how{padding-left:20px;margin:0 0 12px}.how li{margin-bottom:6px}
.cheat{background:#f1e6c8;border-radius:10px;padding:10px 14px}
.cheat dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}.cheat dt{font-weight:800}.cheat dd{margin:0}
.keys{font-size:14px;color:#5a4a36}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.stage{text-align:left;background:#fff9ea;border:2px solid #d8c8a2;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:120px;color:var(--ink)}
.stage:not(:disabled):hover{border-color:var(--red)}
.stage b{font:400 18px/1.1 "Alfa Slab One",serif;color:var(--red)}
.sn{font-size:13px;font-weight:700;color:var(--muted)}.ss{font-size:13px}.lock{font-size:12px;color:var(--muted)}
.stars{display:flex;gap:2px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bigstars{display:flex;justify-content:center;gap:6px;margin:4px 0}
.facts{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:4px}.facts b{display:inline-block;width:80px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;margin:10px 0}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #d8c8a2;padding:3px 0}
.stats dt{color:#5a4a36}.stats dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.per{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.per th{text-align:right;color:var(--muted);font-weight:700;padding:3px 6px}.per th:first-child,.per td:first-child{text-align:left}
.per td{text-align:right;padding:4px 6px;border-top:1px solid #e6dabd;font-variant-numeric:tabular-nums}
.per td i,.players i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc);margin-right:6px;vertical-align:-1px}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff9ea;border:1px solid #e3d4ae;border-radius:10px;padding:8px 12px}
.up p{margin:0;font-size:14px}.up b{font-size:16px}.scope{font-size:12px;color:var(--green);font-weight:700}
.up button{min-height:44px;min-width:86px;border-radius:10px;border:0;background:var(--green);color:#fff;font-weight:800;white-space:nowrap}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}.pips i{width:10px;height:10px;border-radius:2px;background:#e3d4ae}.pips i.on{background:var(--orange)}
.fld{display:flex;flex-direction:column;font-weight:700;gap:4px;margin-bottom:12px;max-width:320px}
input{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:2px solid #c9b994;background:#fff;color:var(--ink);padding:6px 12px}
.mp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mp>div{background:#f1e6c8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.mp p{margin:0;font-size:14px}
.mp .big{min-height:46px;border-radius:10px;border:0;background:var(--red);color:#fff6e4;font:400 17px/1 "Alfa Slab One",serif}
.mp .big.alt{background:var(--green)}
.code{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.code b{font:400 clamp(30px,6vw,44px)/1 "Alfa Slab One",serif;letter-spacing:.12em;color:var(--red);background:#f1e6c8;border-radius:10px;padding:8px 14px}
.code button{min-height:44px;border-radius:10px;border:2px solid #c9b994;background:#fff9ea;font-weight:700;padding:0 14px}
.players{list-style:none;padding:0;margin:12px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.players li{background:#fff9ea;border:1px solid #e3d4ae;border-radius:10px;padding:8px 10px;font-weight:700;display:flex;align-items:center;gap:6px}
.players em{font-style:normal;font-size:12px;color:#fff;background:var(--green);border-radius:4px;padding:0 6px}
.players .emptyslot{color:var(--muted);font-weight:500;border-style:dashed}.players .emptyslot i{background:#e3d4ae}
.sgsel{display:flex;flex-wrap:wrap;gap:6px}.sgsel button{min-height:40px;border-radius:999px;border:2px solid #c9b994;background:#fff9ea;font-weight:700;padding:0 12px;font-size:14px}
.sgsel button.on{background:var(--green);color:#fff;border-color:var(--green)}
@media (max-width:1199px){

<body>
<div id="app">
  <header id="hud">
    <div class="brand">Kopitiam <span>Simulator</span></div>
    <div class="hstat" id="hShift">Kedai Kopi Sinar Pagi</div>
    <div class="hstat"><span class="lbl">Time</span><b id="hClock">7:00 am</b></div>
    <div class="hstat"><span class="lbl">Earned</span><b id="hMoney">RM0.00</b></div>
    <div class="hstat"><span class="lbl">Satisfaction <span id="hSatTxt">75%</span></span><span class="bar"><i id="hSat" style="width:75%"></i></span></div>
    <div class="hstat"><span class="lbl">Drinks waiting</span><b id="hQueue">0</b></div>
    <div class="hstat" id="hWx">Clear morning</div>
    <div class="hbtns"><button id="bSound" class="ib" aria-pressed="true">Sound on</button><button id="bPause" class="ib">Pause</button></div>
  </header>
  <main id="play">
    <section id="stage" aria-label="The kopitiam">
      <div id="view">
        <canvas id="cv"></canvas>
        <div id="ovl" aria-hidden="true"></div>
        <div id="camBtns" aria-label="Camera"><button data-cam="front">Front</button><button data-cam="corner">Corner</button><button data-cam="top">Top</button></div>
        <div id="tip" hidden></div>
        <div id="banner" role="status"></div>
      </div>
    </section>
    <section id="railSec" aria-label="Drink orders">
      <div class="st-head"><h2>Drink orders</h2><span id="railCount"></span><button id="bBook" aria-expanded="false">Buku 555</button></div>
      <div id="book" hidden></div>
      <div id="rail"></div>
    </section>
    <section id="traySec" aria-label="Brewing and ready tray">
      <div class="st-head"><h2>Brewing</h2></div>
      <div id="slots"></div>
      <div class="st-head"><h2>Ready tray</h2><p id="trayNote"></p></div>
      <div id="tray"></div>
      <div id="outList"></div>
    </section>
    <section id="prepSec" aria-label="Drink station">
      <div id="prep">
        <div id="cupBox"><div id="cupView"></div><div id="cupName">Empty cup</div></div>
        <div id="tgtLine">Free pour: pick a ticket to aim at an order</div>
        <div id="ctrl">
          <div class="row"><span class="rl">Base</span><button data-g="b" data-v="kopi">Kopi<small>1</small></button><button data-g="b" data-v="teh">Teh<small>2</small></button><button data-g="b" data-v="milo">Milo<small>3</small></button><button data-g="b" data-v="limau">Limau<small>4</small></button><button data-g="b" data-v="cham">Cham<small>5</small></button></div>
          <div class="row"><span class="rl">Milk</span><button data-g="m" data-v="none" title="No milk">O<small>no milk · Q</small></button><button data-g="m" data-v="pekat" title="Condensed milk">Pekat<small>condensed · W</small></button><button data-g="m" data-v="cair" title="Evaporated milk">C<small>evaporated · E</small></button></div>
          <div class="row"><span class="rl">Pull</span><button data-g="tk" data-v="1" class="wide">Tarik! <small>pulled tea, for Teh Tarik · R</small></button></div>
          <div class="row"><span class="rl">Sugar</span><button data-g="s" data-v="0">Kosong<small>A</small></button><button data-g="s" data-v="1">Kurang<small>S</small></button><button data-g="s" data-v="2">Normal<small>D</small></button><button data-g="s" data-v="3">Extra<small>F</small></button></div>
          <div class="row"><span class="rl">Temperature</span><button data-g="tp" data-v="hot">Panas<small>hot · Z</small></button><button data-g="tp" data-v="ice">Ais<small>iced · X</small></button></div>
          <div class="row"><span class="rl">Ice (iced only)</span><button data-g="i" data-v="1">Less<small>C</small></button><button data-g="i" data-v="2">Normal<small>V</small></button><button data-g="i" data-v="3">Extra<small>B</small></button></div>
        </div>
        <div id="prepMsg" role="status"></div>
        <div class="acts"><button id="bDump">Buang<kbd>Bksp</kbd></button><button id="bBrew">Bancuh!<kbd>Space</kbd></button></div>
      </div>
    </section>
  </main>
  <div id="hint" hidden></div>
</div>
<div id="ov" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ================= CONFIG & DATA =================
// Game-balancing parameters (not real-world statistics). Tweak freely.
const CFG = {
  W: 1100, H: 560,
  bevAny: 0.72,      // chance a customer orders at least one beverage
  bevTwo: 0.15,      // of beverage-orderers: chance of two drinks
  bevThree: 0.03,    // of beverage-orderers: chance of three drinks
  satStart: 75,
  walkSpeed: 78,
  outsideWait: 14,   // seconds a party waits outside for a seat
  lastCall: 35,      // seconds after closing before remaining orders are missed
  icedSurcharge: 0.30,
  maxPlayers: 4
};

const BASES = {
  kopi:  { n: 'Kopi',  t: 2.0, key: '1' },
  teh:   { n: 'Teh',   t: 2.2, key: '2' },
  milo:  { n: 'Milo',  t: 1.6, key: '3' },
  limau: { n: 'Limau', t: 1.4, key: '4' },
  cham:  { n: 'Cham',  t: 2.4, key: '5' }
};
const BASE_KEYS = ['kopi', 'teh', 'milo', 'limau', 'cham'];
const MILKS = ['none', 'pekat', 'cair'];          // O / condensed / evaporated (C)
const MILK_LABEL = { none: 'O (no milk)', pekat: 'Susu pekat', cair: 'Susu cair (C)' };
const SUGARS = ['Kosong', 'Kurang manis', 'Normal', 'Extra manis'];
const ICES = ['No ice', 'Less ice', 'Normal ice', 'Extra ice'];

// Liquid colours per base + milk
function liquidColour(b, m, tk) {
  const t = {
    kopi:  { none: '#2b1a10', pekat: '#9a6a43', cair: '#7a4d2c' },
    teh:   { none: '#9c3d12', pekat: '#c98a55', cair: '#b8743f' },
    milo:  { none: '#5a3522', pekat: '#7b4a30', cair: '#6e4128' },
    limau: { none: '#c9d65a', pekat: '#d9df9a', cair: '#d3d88a' },
    cham:  { none: '#5a2f18', pekat: '#a87148', cair: '#8f5a33' }
  };
  if (!b) return null;
  let c = (t[b] || t.kopi)[m || 'none'];
  if (b === 'teh' && tk && m === 'pekat') c = '#cf9a66';
  return c;
}

const RECIPES = [
  { id: 'kopi',  name: 'Kopi',      b: 'kopi',  m: 'pekat', tk: 0, price: 1.8, sug: [1, 2, 3] },
  { id: 'kopio', name: 'Kopi O',    b: 'kopi',  m: 'none',  tk: 0, price: 1.5, sug: [0, 1, 2, 3] },
  { id: 'kopic', name: 'Kopi C',    b: 'kopi',  m: 'cair',  tk: 0, price: 2.0, sug: [0, 1, 2, 3] },
  { id: 'teh',   name: 'Teh',       b: 'teh',   m: 'pekat', tk: 0, price: 1.8, sug: [1, 2, 3] },
  { id: 'teho',  name: 'Teh O',     b: 'teh',   m: 'none',  tk: 0, price: 1.5, sug: [0, 1, 2, 3] },
  { id: 'tehc',  name: 'Teh C',     b: 'teh',   m: 'cair',  tk: 0, price: 2.0, sug: [0, 1, 2, 3] },
  { id: 'tarik', name: 'Teh Tarik', b: 'teh',   m: 'pekat', tk: 1, price: 2.2, sug: [1, 2, 3] },
  { id: 'milo',  name: 'Milo',      b: 'milo',  m: 'pekat', tk: 0, price: 2.5, sug: [1, 2, 3] },
  { id: 'limau', name: 'Limau',     b: 'limau', m: 'none',  tk: 0, price: 1.8, sug: [1, 2, 3], iceOnly: 1 },
  { id: 'cham',  name: 'Cham',      b: 'cham',  m: 'pekat', tk: 0, price: 2.8, sug: [1, 2, 3] }
];
const REC = Object.fromEntries(RECIPES.map(r => [r.id, r]));

// drink = {b, m, tk, s, tp:'hot'|'ice', i}
function encDrink(d) {
  return BASE_KEYS.indexOf(d.b) + 5 * MILKS.indexOf(d.m) + 15 * (d.tk ? 1 : 0) + 30 * d.s + 120 * (d.tp === 'ice' ? 1 : 0) + 240 * (d.i || 0);
}
function decDrink(c) {
  c = c | 0;
  return {
    b: BASE_KEYS[c % 5], m: MILKS[Math.floor(c / 5) % 3], tk: Math.floor(c / 15) % 2,
    s: Math.floor(c / 30) % 4, tp: Math.floor(c / 120) % 2 ? 'ice' : 'hot', i: Math.floor(c / 240) % 4
  };
}
function recipeOf(d) { return RECIPES.find(r => r.b === d.b && r.m === d.m && (r.tk || 0) === (d.tk ? 1 : 0)) || null; }
function drinkTitle(d) {
  const r = recipeOf(d);
  let n = r ? r.name : (BASES[d.b] ? BASES[d.b].n : '?') + (d.m === 'none' ? ' O' : d.m === 'cair' ? ' C' : '') + (d.tk ? ' (tarik)' : '');
  if (d.s === 0) n += ' Kosong';
  if (d.tp === 'ice') n += ' Ais';
  return n;
}
function drinkChips(d) {
  const c = [];
  if (d.s === 1) c.push(['sugar', 'Kurang manis']);
  else if (d.s === 3) c.push(['sugar', 'Extra manis']);
  else if (d.s === 0) c.push(['sugar', 'No sugar']);
  else c.push(['sugar', 'Normal sweet']);
  c.push(d.tp === 'ice' ? ['ice', 'Iced'] : ['hot', 'Hot']);
  if (d.tp === 'ice') c.push(['ice', ICES[d.i]]);
  return c;
}
function drinkPrice(d) {
  const r = recipeOf(d);
  return (r ? r.price : 1.5) + (d.tp === 'ice' ? CFG.icedSurcharge : 0);
}
// English description used by tourists
function drinkEnglish(d) {
  const eng = { kopio: 'black coffee', kopi: 'coffee with sweet milk', kopic: 'coffee with evaporated milk', teh: 'milk tea', teho: 'black tea', tehc: 'tea with evaporated milk', tarik: 'frothy pulled milk tea', milo: 'chocolate malt drink', limau: 'lime juice', cham: 'coffee-and-tea mix' };
  const r = recipeOf(d);
  let s = (d.tp === 'ice' ? 'Iced ' : 'Hot ') + (r ? eng[r.id] : 'something');
  if (d.s === 0) s += ', no sugar';
  else if (d.s === 1) s += ', less sweet';
  else if (d.s === 3) s += ', extra sweet';
  if (d.tp === 'ice' && d.i === 1) s += ', less ice';
  if (d.tp === 'ice' && d.i === 3) s += ', lots of ice';
  return s + ' please!';
}
// difference between ordered and made drink: 0 exact, 1 minor, 2 major
function drinkDiff(want, made) {
  if (want.b !== made.b || want.m !== made.m || (want.tk ? 1 : 0) !== (made.tk ? 1 : 0) || want.tp !== made.tp) return 2;
  if (want.s !== made.s) return 1;
  if (want.tp === 'ice' && want.i !== made.i) return 1;
  return 0;
}

  p.members.forEach((m, i) => {
    m.seat = order[i];
    const lead = [{ x: p.ex + (i % 2) * 14 - 7, y: STREET_Y }, { x: p.ex, y: 600 }, entryPt(p.ex)];
    if (p.flow === 'B' && !m.kid) { m.path = [...lead, ...route(entryPt(p.ex), STALLS[m.stall].aisle), STALLS[m.stall].front]; m.mst = 'toStall'; }
    else { m.path = [...lead, ...pathToSeat(entryPt(p.ex), t, m.seat)]; m.mst = 'toSeat'; }
    m.delay = i * 0.4;

  return true;
}
function pathToSeat(from, t, seat) { const S = SEATS[seat], ex = S.ex(t); return [...route(from, ex), { x: t.x + S.dx, y: t.y + S.dy }]; }

function moveTo(o, dt, speed) {

  if (!o.path.length) return true;
  const tg = o.path[0], dx = tg.x - o.x, dy = tg.y - o.y, d = Math.hypot(dx, dy), sp = speed * dt;

  return !o.path.length;
}

// ---- drinks ----
function genDrink(w, p, m) {
  const st = STAGES[w.sg], T = TYPES[p.type];
  if (m.reg >= 0) return Object.assign({}, REGULARS[m.reg].d);
  const allowed = new Set(st.rec); if (w.shared.cham) allowed.add('cham');
  const hr = clockHour(w), stall = STALLS[m.stall] || STALLS[0];
  let wt = {};
  for (const k in T.w) if (allowed.has(k)) wt[k] = T.w[k];
  if (!Object.keys(wt).length) st.rec.forEach(k => wt[k] = 1);
  if (m.kid && allowed.has('milo')) wt = { milo: 5, teh: 1 }; if (m.kid && allowed.has('limau')) wt.limau = 2;
  if (allowed.has('tarik') && stall.pull.tarik) wt.tarik = (wt.tarik || 0.5) * stall.pull.tarik;
  if (allowed.has('limau') && stall.pull.limau) wt.limau = (wt.limau || 0.4) * stall.pull.limau;
  for (const k in wt) {
    const b = REC[k].b;
    if (stall.pull[b]) wt[k] *= stall.pull[b];
    if (hr < 9 && (b === 'kopi' || b === 'teh')) wt[k] *= 1.3;
    if (hr >= 9 && (b === 'milo' || b === 'limau')) wt[k] *= 1.4;
    if (w.weather === 'hot' && (b === 'milo' || b === 'limau')) wt[k] *= 1.4;
    if (w.weather === 'rain' && (b === 'kopi' || b === 'teh')) wt[k] *= 1.25;
  }
  const r = REC[wpick(wt)] || REC.kopi;
  let icedP = st.icedP + T.iced + (w.weather === 'hot' ? 0.2 : 0) + (stall.spicy ? 0.15 : 0) + (m.kid ? 0.3 : 0) + (hr >= 9 ? 0.08 : 0);
  if (w.weather === 'rain') icedP *= 0.35;
  const tp = r.iceOnly || Math.random() < clamp(icedP, 0.02, 0.92) ? 'ice' : 'hot';
  const cp = st.customP + (st.day === 'weekend' ? 0.1 : 0);
  let s = 2;
  if (Math.random() < cp) { const opts = r.sug.filter(v => v !== 2 && (v !== 0 || st.kosong)); if (opts.length) s = pick(opts); }
  let i = 0;
  if (tp === 'ice') i = Math.random() < cp * 0.8 ? pick([1, 3]) : 2;
  return { b: r.b, m: r.m, tk: r.tk || 0, s, tp, i };
}
function SAVE_HOST_REGS() { return SAVE.regs || (SAVE.regs = {}); }

// The runner is at the table asking: decide each member's drink (posted when the runner gets back to the counter)
function askDrinks(w, p) {
  const st = STAGES[w.sg], T = TYPES[p.type], P = PERSONALITIES[p.pers];
  const nP = Math.max(1, w.players.length);
  const out = [];
  p.members.forEach((m, idx) => {
    let prob = CFG.bevAny + T.bev + (w.weather === 'hot' ? 0.04 : 0) + (w.weather === 'rain' ? 0.10 : 0) + (clockHour(w) < 9 ? 0.03 : 0);
    if (m.reg >= 0) prob = 1;
    if (Math.random() >= clamp(prob, 0.1, 0.98)) { if (idx === 0 || Math.random() < 0.5) out.push({ m, s: pick(STAFF_LINES.none) }); return; }
    const r = Math.random();
    let cnt = r < CFG.bevThree ? 3 : r < CFG.bevThree + CFG.bevTwo + (T.multi || 0) ? 2 : 1;
    if (m.kid || m.reg >= 0) cnt = 1;
    const ds = [];
    for (let k = 0; k < cnt; k++) {
      const d = genDrink(w, p, m);
      const known = !w.demo && m.reg >= 0 && SAVE_HOST_REGS()[m.reg];
      const patMax = 1.2 * st.pat * T.pat * P.pat * (1 + 0.1 * w.shared.fan) * (1 + 0.06 * (nP - 1)) * (p.type === 'tourist' || known ? 1.15 : 1) * (p.type === 'student' && w.parties.length > 8 ? 0.85 : 1);
      ds.push({ id: w.nid++, party: p.id, table: p.table, mid: m.id, d, code: encDrink(d), pat: patMax, patMax, f: 1, st: 'wait', cl: -1, tourist: p.type === 'tourist' ? 1 : 0, usual: known ? 1 : 0, reg: m.reg, pers: p.pers, type: p.type, t0: 0, c50: 0, c25: 0, srv: 0 });
      if (m.reg >= 0 && !known && !w.demo) { SAVE_HOST_REGS()[m.reg] = 1; saveGame(); }
    }
    const d0 = ds[0];
    out.push({ m, s: d0.usual ? 'Yang biasa!' : p.type === 'tourist' ? drinkEnglish(d0.d).replace(' please!', '') : drinkTitle(d0.d) + (cnt > 1 ? ' + ' + (cnt - 1) + ' more' : ''), ds });
  });
  return out;
}

// ---- main step ----
function stepWorld(w, dt) {
  if (w.ph !== 'play') return;
  const st = STAGES[w.sg];
  w.t += dt;
  const nPlayers = Math.max(1, w.players.length);
  if (w.t < st.dur) {
    w.spawnT -= dt;
    const queued = w.parties.filter(p => p.st === 'queue').length;
    if (w.spawnT <= 0) { if (queued < 3) spawnParty(w); w.spawnT = rnd(st.spawn[0], st.spawn[1]) * (w.weather === 'rain' ? 1.2 : 1) / (1 + 0.5 * (nPlayers - 1)); }
  } else if (!w.lastCallShown) { w.lastCallShown = 1; ev(w, { k: 'banner', s: 'Closing time! Finish the last orders' }); }

  for (const p of w.parties) stepParty(w, p, dt, st);
  w.parties = w.parties.filter(p => p.st !== 'gone');
  w.runners.forEach(r => stepRunner(w, r, dt));
  w.helpers.forEach((h, i) => stepHelper(w, h, i, dt));

  // drink order patience
  for (const o of w.orders) {
    if (o.st !== 'wait') continue;
    const m = findMember(w, o.mid);
    o.pat -= dt * (o.srv ? 0.4 : 1); o.f = Math.max(0, o.pat / o.patMax);
    if (o.f < 0.5 && !o.c50) { o.c50 = 1; if (m) say(w, m, pick(LINES.call)); ev(w, { k: 'boss', m: o.mid }); }
    if (o.f < 0.25 && !o.c25) { o.c25 = 1; addSat(w, -1); if (m) say(w, m, pick(LINES.angry)); }
    if (o.pat <= 0) missOrder(w, o, m);
  }
  w.orders = w.orders.filter(o => o.st === 'wait' || w.t - (o.tEnd || 0) < 1);

  // ambient chatter
  w.chatT -= dt;
  if (w.chatT <= 0) {
    w.chatT = rnd(2.5, 5);
    const seated = w.parties.filter(p => p.members.some(m => m.mst === 'seated' && m.food >= 1));
    if (seated.length) { const p = pick(seated), m = pick(p.members); const pool = p.type === 'tourist' ? LINES.tourist : (w.weather === 'rain' && Math.random() < 0.5 ? LINES.rain : LINES.chat); if (!m.kid && m.mst === 'seated') say(w, m, pick(pool)); }
  }
  if (w.sat <= 0) return endShift(w, 1);
  if (w.t >= st.dur) {
    const busy = w.orders.some(o => o.st === 'wait') || w.takeQ.length || w.runners.some(r => r.st === 'toTable' || r.st === 'asking' || r.st === 'toCounter') || w.parties.some(p => p.table >= 0 && ['wait', 'req'].includes(p.drink) && p.st !== 'leave');
    if (!busy || w.t >= st.dur + CFG.lastCall) endShift(w, 0);
  }
}

function stepParty(w, p, dt, st) {
  const T = TABLES[p.table];
  if (p.st === 'queue') {
    p.members.forEach(m => { if (moveTo(m, dt, CFG.walkSpeed)) { m.pose = 'stand'; m.yaw = Math.PI; } else m.pose = 'walk'; });
    p.wait -= dt;
    if (seatParty(w, p)) return;
    if (p.wait <= 0) { p.st = 'leave'; addSat(w, -1.5); w.stats.noSeat++; say(w, p.members[0], 'Full house... next time'); p.members.forEach(m => { m.mst = 'leaving'; m.path = [{ x: m.x < 500 ? -60 : SHOP_W + 60, y: STREET_Y }]; }); }
    return;
  }
  if (p.st === 'leave') {
    let gone = true;
    p.members.forEach(m => { if (!moveTo(m, dt, CFG.walkSpeed)) { m.pose = 'walk'; gone = false; } });
    if (gone) p.st = 'gone';
    return;
  }
  // p.st === 'in'
  for (const m of p.members) stepMember(w, p, m, dt, st);
  const allSeated = p.members.every(m => m.mst === 'seated');
  // ask for drinks: flow A as soon as everyone sits; flow B once they are back with their food ordered
  if (p.drink === 'wait' && allSeated) { p.drink = 'req'; w.takeQ.push(p.id); p.reqT = w.t; }
  if (p.drink === 'req' && w.t - p.reqT > 12 && !p.waved) { p.waved = 1; const m = p.members[0]; say(w, m, 'Boss! Minum!'); m.waveT = 2.5; }
  // flow A: after the drink order is taken, look around, then go to the stalls
  if (p.flow === 'A' && (p.drink === 'taken' || p.drink === 'posted') && !p.wentFood) {
    p.wentFood = 1;
    p.members.forEach((m, i) => { if (!m.kid) { m.mst = 'look'; m.timer = rnd(1.5, 3.2) + i * 0.6; } });
  }
  p.sipT -= dt;
  const allDone = p.members.every(m => m.food === 3 && m.mst === 'seated');
  const pending = w.orders.some(o => o.party === p.id && o.st === 'wait') || w.serveQ.some(q => q.tb === p.table) || w.runners.some(r => r.task && r.task.pid === p.id);
  if (allDone && !pending && p.drink === 'posted' && p.sipT <= 0) {
    p.st = 'leave'; w.tableParty[p.table] = -1;
    const happy = p.members.every(m => m.mood <= 1);
    if (happy && Math.random() < 0.45) say(w, p.members[0], pick(['Ok boss, jalan dulu!', 'Bye boss!', 'Sedap, thanks!']));
    p.members.forEach((m, i) => {
      const ex = SEATS[m.seat].ex(T); m.mst = 'leaving'; m.cup = -1; m.food = 0;
      m.path = [ex, ...route(ex, entryPt(p.ex)), { x: p.ex, y: 600 }, { x: p.ex + (i % 2) * 14, y: STREET_Y }, { x: Math.random() < 0.5 ? -60 : SHOP_W + 60, y: STREET_Y }];
      m.delay = i * 0.3;
    });
  }
}

function stepMember(w, p, m, dt, st) {
  const T = TABLES[p.table], stall = STALLS[m.stall];
  if (m.mst === 'toSeat' || m.mst === 'toStall' || m.mst === 'arrive') {
    if (moveTo(m, dt, CFG.walkSpeed * (m.kid ? 1.05 : 1))) {
      if (m.mst === 'toStall') { m.mst = 'atStall'; m.timer = rnd(1.8, 2.8); m.yaw = stall.faceCust; m.pose = 'order'; say(w, m, stall.say); }
      else { m.mst = 'seated'; m.pose = 'sit'; m.yaw = yawTo(m.x, m.y, T.x, T.y); }
    } else if (m.delay <= 0) m.pose = 'walk'; else m.pose = 'stand';
    return;
  }
  if (m.mst === 'atStall') {
    m.timer -= dt; m.pose = 'order';
    if (m.timer <= 0) {
      // order for self and any kids at the table
      const cook = rnd(6, 12) * (st.key === 'weekend' ? 1.15 : 1);
      w.stallQ[m.stall].push({ mid: m.id, pid: p.id, ready: w.t + cook });
      m.food = 1;
      if (p.members[0] === m) p.members.filter(k => k.kid).forEach(k => { w.stallQ[m.stall].push({ mid: k.id, pid: p.id, ready: w.t + cook + 1 }); k.food = 1; });
      m.mst = 'toSeat'; m.path = [stall.front, stall.aisle, ...pathToSeat(stall.aisle, T, m.seat)];
    }
    return;
  }
  if (m.mst === 'look') {
    m.timer -= dt; m.pose = 'look';
    if (m.timer <= 0) { const ex = SEATS[m.seat].ex(T); m.mst = 'toStall'; m.path = [ex, ...route(ex, stall.aisle), stall.front]; }
    return;
  }
  if (m.mst !== 'seated') return;
  m.yaw = yawTo(m.x, m.y, T.x, T.y);
  // eating
  if (m.food === 2) { m.eatT -= dt; if (m.eatT <= 0) m.food = 3; }
  const mine = w.orders.filter(o => o.mid === m.id && o.st === 'wait');
  const f = mine.length ? Math.min(...mine.map(o => o.f)) : 1;
  const ph = Math.floor(w.t / 5 + m.phase);
  if (m.sipShow > 0) { m.sipShow -= dt; m.pose = 'drink'; }
  else if (m.waveT > 0) { m.waveT -= dt; m.pose = 'wave'; }
  else if (mine.length && f < 0.5) m.pose = 'wave';
  else if (w.runners.some(r => r.st === 'asking' && r.task && r.task.pid === p.id)) m.pose = 'talk';
  else if (m.food === 2) m.pose = (m.look.paper && ph % 3 === 0) ? 'paper' : 'eat';
  else if (m.look.paper && !m.kid) m.pose = 'paper';
  else if (p.pers === 'distracted' || m.look.lanyard || m.look.bag) m.pose = ph % 2 ? 'phone' : 'sit';
  else m.pose = ph % 3 === 0 ? 'look' : ph % 3 === 1 ? 'talk' : 'sit';
  m.mood = mine.length ? (f < 0.25 ? 3 : f < 0.5 ? 2 : 1) : (m.served ? 0 : m.mood > 1 ? m.mood : 1);
}

// ---- drink runners: take orders at tables, carry drinks from the counter ----
function stepRunner(w, r, dt) {
  const speed = 125;
  if (r.st === 'idle') {
    r.pose = 'stand'; r.yaw = -Math.PI / 2;
    if (r.path.length) { moveTo(r, dt, speed); r.pose = 'walk'; return; }
    if (w.serveQ.length) {
      const q = w.serveQ.shift(); r.task = q; q.pid = w.tableParty[q.tb];
      const slot = BAR.slots[clamp(q.p, 0, 3)];
      r.path = route({ x: r.x, y: r.y, on: 'V' }, { x: 180, y: slot, on: 'V' }); r.st = 'toPickup';
    } else if (w.takeQ.length) {
      const pid = w.takeQ.shift(); const p = w.parties.find(p => p.id === pid);
      if (p && p.st === 'in') { const T = TABLES[p.table]; const spot = { x: T.x - 80, y: T.y, on: 'V' }; r.task = { pid, tb: p.table }; r.path = route({ x: r.x, y: r.y, on: 'V' }, spot); r.st = 'toTable'; p.drink = 'asking'; }
    } else if (Math.hypot(r.x - RUNNER_HOME[r.i].x, r.y - RUNNER_HOME[r.i].y) > 2) r.path = route({ x: r.x, y: r.y, on: 'V' }, RUNNER_HOME[r.i]);
    return;
  }
  const arrived = moveTo(r, dt, speed);
  r.pose = arrived ? 'stand' : r.carry >= 0 ? 'carry' : 'walk';
  if (!arrived) return;
  const p = r.task && w.parties.find(p => p.id === r.task.pid);
  if (r.st === 'toTable') {
    if (!p || p.st !== 'in') { r.st = 'idle'; r.task = null; return; }
    r.st = 'asking'; r.t = 2.6; r.said = 0; sayStaff(w, 'r', r.i, pick(STAFF_LINES.ask));
    r.task.out = askDrinks(w, p);
  } else if (r.st === 'asking') {
    const T = TABLES[r.task.tb]; r.yaw = yawTo(r.x, r.y, T.x, T.y); r.pose = 'ask';
    r.t -= dt;
    if (r.t < 1.9 && !r.said) { r.said = 1; (r.task.out || []).forEach(o => say(w, o.m, o.s)); }
    if (r.t <= 0) {
      if (p) p.drink = 'taken';
      r.st = 'toCounter'; r.path = route({ x: r.x, y: r.y, on: 'V' }, { x: 180, y: BAR.slots[1] + 35, on: 'V' });
    }
  } else if (r.st === 'toCounter') {
    const ds = (r.task.out || []).flatMap(o => o.ds || []);
    if (p) p.drink = 'posted';
    if (ds.length && p && p.st === 'in') {
      ds.forEach(o => { o.t0 = w.t; w.orders.push(o); w.stats.orders++; });
      sayStaff(w, 'r', r.i, 'T' + (r.task.tb + 1) + ': ' + (ds.length > 1 ? ds.length + ' drinks!' : drinkTitle(ds[0].d) + '!'));
      ev(w, { k: 'post', tb: r.task.tb, n: ds.length });
    }
    r.st = 'idle'; r.task = null;
  } else if (r.st === 'toPickup') {
    r.st = 'pickup'; r.t = 0.45; r.yaw = -Math.PI / 2;
  } else if (r.st === 'pickup') {
    r.t -= dt; r.yaw = -Math.PI / 2;
    if (r.t <= 0) {
      r.carry = r.task.c;
      const q = r.task, T = TABLES[q.tb];
      const o = w.orders.find(o => o.id === q.o && o.table === q.tb);
      const m = o ? findMember(w, o.mid) : (p && p.members[0]);
      const seat = m && m.seat >= 0 ? m.seat : 3;
      const spot = SEATS[seat].ex(T);
      r.task.seat = seat;
      r.path = route({ x: r.x, y: r.y, on: 'V' }, spot); r.st = 'toServe';
    }
  } else if (r.st === 'toServe') {
    r.st = 'serving'; r.t = 0.7;
  } else if (r.st === 'serving') {
    const T = TABLES[r.task.tb]; r.yaw = yawTo(r.x, r.y, T.x, T.y); r.pose = 'serve';
    r.t -= dt;
    if (r.t <= 0) {
      const res = deliver(w, r.task.p, r.task);
      if (res === 'ok' || res === 'minor' || res === 'wasted') r.carry = -1;
      const back = RUNNER_HOME[r.i];
      const here = SEATS[r.task.seat || 3].ex(T);
      r.path = route(here, back); r.st = 'return';
    }
  } else if (r.st === 'return') {
    r.carry = -1; r.st = 'idle'; r.task = null;
  }
}

// ---- stall helpers: carry food from the stall to the table ----
function stepHelper(w, h, i, dt) {
  const s = STALLS[i], q = w.stallQ[i];
  if (h.st === 'idle') {
    h.yaw = s.faceStaff; h.carry = 0;
    const job = q.find(j => j.ready <= w.t);
    h.pose = q.length ? 'prep' : 'stand';
    if (job) {
      const p = w.parties.find(p => p.id === job.pid), m = p && p.members.find(m => m.id === job.mid);
      q.splice(q.indexOf(job), 1);
      if (!p || !m || p.st !== 'in') return;
      h.job = job; h.carry = 1; h.st = 'go';
      const T = TABLES[p.table], ex = SEATS[m.seat].ex(T);
      h.exitPt = ex; h.path = [s.front, s.aisle, ...route(s.aisle, ex)];
    }
    return;
  }
  const arrived = moveTo(h, dt, 105);
  h.pose = arrived ? 'stand' : h.carry ? 'carry' : 'walk';
  if (!arrived) return;
  if (h.st === 'go') { h.st = 'give'; h.t = 0.6; }
  else if (h.st === 'give') {
    const p = w.parties.find(p => p.id === h.job.pid), m = p && p.members.find(m => m.id === h.job.mid);
    if (p) { const T = TABLES[p.table]; h.yaw = yawTo(h.x, h.y, T.x, T.y); }
    h.pose = 'serve'; h.t -= dt;
    if (h.t <= 0) {
      if (m) { m.food = 2; m.eatT = rnd(14, 24) * (STAGES[w.sg].eatMul || 1) * (TYPES[p.type].eat || 1); if (Math.random() < 0.3) say(w, m, pick(['Wah, sedap!', 'Thank you!', 'Ho sek!'])); }
      h.carry = 0; h.st = 'back';
      h.path = [...route(h.exitPt, s.aisle), s.front, s.home];
    }
  } else if (h.st === 'back') { h.st = 'idle'; h.job = null; }
}

function missOrder(w, o, m) {
  o.st = 'miss'; o.tEnd = w.t; w.stats.missed++; w.stats.streak = 0; addSat(w, -6);
  if (m) { m.mood = 3; say(w, m, pick(LINES.missed)); ev(w, { k: 'float', x: m.x, y: m.y, s: 'Missed', c: 'r' }); }
}

function endShift(w, failed) {
  if (w.ph !== 'play') return;
  for (const o of w.orders) if (o.st === 'wait') missOrder(w, o, null);
  w.ph = 'end'; w.failed = failed ? 1 : 0;
  w.result = shiftResult(w);
  ev(w, { k: 'end' });
}

function shiftResult(w) {
  const s = w.stats, total = Math.max(1, s.orders), r = s.ok / total;
  let stars = 0;
  if (!w.failed && s.orders > 0) { if (r >= 0.85 && w.sat >= 75) stars = 3; else if (r >= 0.65 && w.sat >= 55) stars = 2; else if (r >= 0.4 && w.sat >= 30) stars = 1; }

  const T = TABLES[tbl];
  const res = r => { ev(w, { k: 'dlv', p: pi, cid: a.cid, r, tb: tbl }); w.orders.forEach(o => { if (o.id === tgt && o.st === 'wait') o.srv = 0; }); return r; };

  const scored = pend.map(o => ({ o, d: drinkDiff(o.d, made) })).sort((x, y) => x.d - y.d || (y.o.id === tgt) - (x.o.id === tgt));

      ev(w, { k: 'float', x: T.x, y: T.y, s: '+' + fmtRM(price) + (tip > 0 ? ' tip ' + fmtRM(tip) : ''), c: 'g', p: pi });

    return res('minor');
  }
  w.stats.streak = 0;

    const o = pend.find(o => o.id === tgt) || best.o; o.pat = Math.max(4, o.pat - o.patMax * 0.15);

    return res('wasted');

  w.stats.wrong++; per.bad++; addSat(w, -2);
  if (m) { m.mood = 2; say(w, m, pick(LINES.wrong)); }

async function netInit() {

  NET.nr = null; NET.unsub = null; NET.mode = 'solo'; NET.players = []; NET.full = []; NET.snap = null; NET.hostPeer = ''; NET.lobby = null; NET.acts = []; NET.lastSeq = {};

}

async function hostRoom(nick) {
  if (!NET.room) throw new Error('Multiplayer is not available in this view.');
  const code = genCode();
  const nr = await NET.room.join('kopi-' + code);
  NET.nr = nr; NET.mode = 'host'; NET.code = code; NET.myIdx = 0;
  NET.players = [{ peer: '', nick, col: 0 }]; NET.full = []; NET.lastSeq = {};

function publishLobby() {
  if (NET.mode !== 'host' || !NET.nr) return;
  NET.nr.presence({ role: 'host', v: 1, st: null, lob: { sg: NET.lobbySg, pl: NET.players.map(p => [p.peer, p.nick, p.col]), full: NET.full.slice(0, 8) } }).catch(() => { });
}

function onPeersHost(ch) {
  const peers = ch.peers;
  const me = peers.find(p => p.sameTab); if (me) { NET.myPeer = me.peer; NET.players[0].peer = me.peer; }
  let changed = false;
  // remove players who left
  for (const p of ch.left) {
    const i = NET.players.findIndex(x => x.peer === p.peer && x.peer !== NET.myPeer);
    if (i > 0) {
      if (S.w && S.w.ph === 'play') { NET.players[i].gone = 1; S.w.orders.forEach(o => { if (o.cl === i) o.cl = -1; }); ev(S.w, { k: 'banner', s: NET.players[i].nick + ' left the counter' }); }
      else { NET.players.splice(i, 1); NET.players.forEach((x, k) => x.col = k); }
      changed = true;
    }
    NET.full = NET.full.filter(x => x !== p.peer);
  }
  for (const p of peers) {
    if (p.sameTab || p.kind !== 'viewer') continue;
    const pr = p.presence || {};
    if (pr.role !== 'player') continue;
    let idx = NET.players.findIndex(x => x.peer === p.peer);
    const nick = String(pr.nick || 'Friend').slice(0, 14);
    if (idx < 0 && !NET.full.includes(p.peer)) {

      else if (!(S.w && S.w.ph === 'play')) { NET.full.push(p.peer); changed = true; }
    } else if (idx >= 0 && NET.players[idx].nick !== nick) { NET.players[idx].nick = nick; changed = true; }

    if (idx > 0 && Array.isArray(pr.acts) && S.w) {
      const last = NET.lastSeq[p.peer] || 0;
      let mx = last;
      for (const a of pr.acts.slice(-16)) {
        if (!a || typeof a !== 'object' || typeof a.s !== 'number' || a.s <= last) continue;
        mx = Math.max(mx, a.s);
        hostAction(S.w, idx, { t: String(a.t), o: a.o | 0, tb: clamp(a.tb | 0, 0, TABLES.length - 1), c: a.c | 0, cid: String(a.cid || '').slice(0, 12) });
      }
      NET.lastSeq[p.peer] = mx;
    }
  }
  if (changed) {
    if (S.w) S.w.players = NET.players.map(p => ({ peer: p.peer, nick: p.nick, col: p.col }));
    if (!(S.w && S.w.ph === 'play')) publishLobby();
    UI.renderLobby();
  }
}

}

function resizeCanvas() {
  const wrap = document.getElementById('stage'); if (!wrap) return;
  const W = wrap.clientWidth - 16;
  const hudH = document.getElementById('hud').offsetHeight;
  document.documentElement.style.setProperty('--hudh', hudH + 'px');
  const iw = window.innerWidth;
  const maxH = iw >= 1200 ? window.innerHeight - hudH - 230 : iw >= 900 ? window.innerHeight - hudH - 20 : Math.max(260, window.innerHeight * 0.52);
  let w = W, h = Math.round(W * 0.6);
  if (h > Math.max(300, maxH)) { h = Math.max(300, maxH); w = Math.min(W, Math.round(h / 0.56)); }
  if (iw < 900) { w = W; h = Math.max(280, Math.min(Math.round(W * (iw < 600 ? 1.0 : 0.62)), maxH)); }
  G.W = w; G.H = h;
  const cv = document.getElementById('cv'); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ov = document.getElementById('ovl'); if (ov) { ov.style.width = w + 'px'; ov.style.height = h + 'px'; }
  if (G.ren) { G.ren.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); G.ren.setSize(w, h, false); G.camera.aspect = w / h; G.camera.updateProjectionMatrix(); }
}

function posePerson(P, pose, t, ph) {

    case 'look': sit(); aL.sh.rotation.x = aR.sh.rotation.x = -0.45; head.rotation.y = Math.sin(t * 1.1 + ph) * 0.9; break;
    case 'talk': sit(); aL.sh.rotation.x = -0.5; aR.sh.rotation.x = -0.7 + Math.sin(t * 4 + ph) * 0.25; head.rotation.x = Math.sin(t * 6 + ph) * 0.08; break;
    case 'order': aR.sh.rotation.x = -1.35 + Math.sin(t * 5) * 0.12; head.rotation.x = -0.1; break;
    case 'cook': aL.sh.rotation.x = -1.0; aR.sh.rotation.x = -1.0 + Math.cos(t * 6 + ph) * 0.25; aR.sh.rotation.z = -0.06 + Math.sin(t * 6 + ph) * 0.3; head.rotation.x = 0.3; break;
    case 'prep': aL.sh.rotation.x = -0.9; aR.sh.rotation.x = -0.9 + Math.sin(t * 14 + ph) * 0.25; head.rotation.x = 0.35; break;
    case 'serve': aR.sh.rotation.x = -1.45; aL.sh.rotation.x = -0.3; props.tray.visible = true; body.rotation.x = 0.08; break;

// ---------- per frame ----------
function render(w, dt) {
  if (!R.ok) return;
  R.t += dt; R.dt = dt;
  // camera
  const c = G.cam, tg = G.camT || CAM_PRESETS.front, k = Math.min(1, dt * 4);
  if (G.camT) { c.az += (tg.az - c.az) * k; c.pol += (tg.pol - c.pol) * k; c.dist += (tg.dist - c.dist) * k; }
  const aspect = G.W / G.H, dist = c.dist * Math.max(1, (aspect < 1.2 ? 1.45 : 1.62) / aspect);
  G.camera.position.set(c.tx + dist * Math.sin(c.pol) * Math.sin(c.az), c.ty + dist * Math.cos(c.pol), c.tz + dist * Math.sin(c.pol) * Math.cos(c.az));
  G.camera.lookAt(c.tx, c.ty, c.tz);

  G.rain.visible = !!rain;
  if (rain) { const a = G.rain.geometry.attributes.position; for (let i = 0; i < a.count; i += 2) { let y = a.getY(i) - dt * 10; if (y < 0) y += 4; a.setY(i, y); a.setY(i + 1, y + 0.45); } a.needsUpdate = true; }
  G.sun.intensity = rain ? 0.3 : hot ? 0.72 : 0.6; G.hemi.intensity = rain ? 0.62 : 0.72; G.hemi.color.set(rain ? '#c9d4e2' : '#fff1d8');
  G.fans.forEach((f, i) => f.rotation.y += dt * (7 + i));
  if (w) { const h = clockHour(w); G.clockH.rotation.z = -(h % 12) / 12 * Math.PI * 2; G.clockM.rotation.z = -(h % 1) * Math.PI * 2; }
  // traffic
  if (!G.carT || (G.carT -= dt) <= 0) { G.carT = rnd(2.5, 6); const dir = Math.random() < 0.5 ? 1 : -1; const v = Math.random() < 0.55 ? makeBike(pick(['#c0392b', '#f1c40f', '#2c3e50', '#16a085'])) : makeCar(pick(['#c0392b', '#f1c40f', '#ecf0f1', '#2c3e50', '#16a085', '#8e44ad'])); v.position.set(-dir * 22, 0, dir > 0 ? 10.6 : 12.6); v.rotation.y = dir > 0 ? 0 : Math.PI; v.userData.v = dir * rnd(4, 7); G.scene.add(v); G.cars.push(v); }

  if (w) syncWorld(w, dt);

  overlays(w);
}

function syncWorld(w, dt) {
  const seen = new Set();
  for (const p of w.parties) for (const m of p.members) {
    const key = 'm' + m.id; seen.add(key);
    let P = G.persons.get(key);
    if (!P) { P = makePerson(m.look, false); P.yaw = m.yaw || 0; G.scene.add(P.g); G.persons.set(key, P); }
    const pos = smoothPos(m, key);
    P.g.position.set(X(pos.x), 0, Z(pos.y)); setYaw(P, m.yaw || 0, dt);
    posePerson(P, m.pose, R.t, m.id % 7);
  }
  for (const [k, P] of G.persons) if (!seen.has(k)) { G.scene.remove(P.g); G.persons.delete(k); }
  // staff
  G.runners.forEach((P, i) => { const r = w.runners[i]; P.g.visible = !!r; if (!r) return; const pos = smoothPos(r, 'r' + i); P.g.position.set(X(pos.x), 0, Z(pos.y)); setYaw(P, r.yaw || 0, dt); const pose = r.carry >= 0 && r.pose === 'walk' ? 'carry' : r.pose; posePerson(P, pose, R.t, i); P.props.cup.visible = r.carry >= 0; P.props.plate.visible = false; if (r.carry >= 0) { const d = decDrink(r.carry); P.props.liq.color.set(liquidColour(d.b, d.m, d.tk)); } });
  G.helpers.forEach((P, i) => { const h = w.helpers[i]; if (!h) return; const pos = smoothPos(h, 'h' + i); P.g.position.set(X(pos.x), 0, Z(pos.y)); setYaw(P, h.yaw || 0, dt); posePerson(P, h.carry && h.pose === 'walk' ? 'carry' : h.pose, R.t, i + 3); P.props.plate.visible = !!h.carry; P.props.cup.visible = false; if (h.carry) P.props.plateFood.material = mat(FOOD_BY_STALL(i).a); });
  G.cooks.forEach((P, i) => { posePerson(P, w.stallQ && w.stallQ[i] && w.stallQ[i].length ? 'cook' : 'stand', R.t, i); });
  G.steam.forEach((ps, i) => { const busy = w.stallQ && w.stallQ[i] && w.stallQ[i].length; ps.forEach(p => { p.visible = !!busy; if (!busy) return; const ph = (R.t * 0.5 + p.userData.k / 4) % 1; p.position.set(p.userData.bx + Math.sin(R.t * 2 + p.userData.k) * 0.1, 1.25 + ph * 1.1, p.userData.bz); p.scale.setScalar(0.08 + ph * 0.18); p.material.opacity = 0.3 * (1 - ph); }); });
  const pls = w.players && w.players.length ? w.players : [{ nick: 'You', col: 0 }];
  G.baristas.forEach((P, i) => { const pl = pls[i]; P.g.visible = !!pl; if (!pl) return; const busy = i === NET.myIdx ? Station.slots.length > 0 : Math.sin(R.t * 0.7 + i * 2) > 0.3; posePerson(P, busy ? 'pour' : 'stand', R.t, i); });
  // table items
  G.tables.forEach((T, ti) => {
    const pid = w.tableParty[ti], p = pid >= 0 ? w.parties.find(p => p.id === pid) : null;
    T.seats.forEach((it, si) => {
      const m = p && p.members.find(m => m.seat === si);
      const showFood = m && m.food >= 2, showCup = m && m.cup >= 0;
      it.plate.visible = !!showFood;
      if (showFood) { const f = FOOD_BY_STALL(m.stall), bowl = f.k === 'bowl', eaten = m.food === 3; it.flat.visible = !bowl; it.flatFood.visible = !bowl && !eaten; it.flatTop.visible = !bowl && !eaten; it.bowl.visible = bowl; it.soup.visible = bowl && !eaten; it.bowlTop.visible = bowl && !eaten; it.foodA.color.set(f.a); it.foodB.color.set(f.b); }
      it.cup.visible = !!showCup;
      if (showCup) { const d = decDrink(m.cup); it.hot.visible = d.tp !== 'ice'; it.ice.visible = d.tp === 'ice'; it.liq.color.set(liquidColour(d.b, d.m, d.tk)); }
    });
  });
}

  const pls = w.players && w.players.length ? w.players : [{ nick: 'You', col: 0 }];

  for (const p of w.parties) {

      if (os) {

        place(ovEl('o' + m.id, 'obub', html), s, -6);
      }
      if (inGame && p.drink === 'req' && m === p.members[0] && p.st === 'in') place(ovEl('q' + p.id, 'wbub', '<span>Waiting for drinks staff</span>'), s, -6);
      const say = R.says.get(String(m.id));
      if (say && R.t - say.t < 2.8) { const e = ovEl('s' + m.id, 'say'); if (e.textContent !== say.s) e.textContent = say.s; place(e, s, os ? -52 : -10); }
    }
  }
  // staff speech
  w.runners.forEach((r, i) => { const say = R.says.get('r' + i); if (say && R.t - say.t < 2.8) { const pos = R.sm.get('r' + i) || r; const e = ovEl('sr' + i, 'say staff'); if (e.textContent !== say.s) e.textContent = say.s; place(e, toScreen(pos.x, pos.y, 2.0), -10); } });
  // barista names
  pls.forEach((pl, i) => { const e = ovEl('b' + i, 'bname' + (i === NET.myIdx ? ' me' : '')); if (e.textContent !== pl.nick) e.textContent = pl.nick; place(e, toScreen(BAR.baristaX, BAR.slots[i], 2.0)); });
  // floaters
  for (const f of R.floats) { f.t += R.dt; const e = ovEl('f' + (f.id || (f.id = Math.random().toString(36).slice(2))), 'float ' + (f.c || 'y')); if (e.textContent !== f.s) e.textContent = f.s; const s = toScreen(f.x, f.y, 1.8); place(e, s, -f.t * 30); e.style.opacity = Math.max(0, 1 - f.t / 1.8); }
  R.floats = R.floats.filter(f => f.t < 1.8);
  for (const [k, e] of G.ov) if (e._seen !== R.frameNo) { e.remove(); G.ov.delete(k); }
}

function tableAtScreen(cx, cy) {
  if (!R.ok) return -1;
  G.ndc.set(cx / G.W * 2 - 1, -(cy / G.H) * 2 + 1);
  G.ray.setFromCamera(G.ndc, G.camera);

}
function setCam(name) { G.camT = Object.assign({}, CAM_PRESETS[name] || CAM_PRESETS.front); document.querySelectorAll('#camBtns button').forEach(b => b.classList.toggle('on', b.dataset.cam === name)); }

// ================= DRINK STATION (local to each player) =================
const $ = id => document.getElementById(id);
const fresh = () => ({ b: null, m: null, tk: 0, s: null, tp: null, i: 0 });

const Station = {
  cup: fresh(), target: 0, started: 0, slots: [], tray: [], out: [], sel: '', cidN: 0, prep: [], msgT: 0,
  reset() { this.cup = fresh(); this.target = 0; this.started = 0; this.slots = []; this.tray = []; this.out = []; this.sel = ''; this.prep = []; this.renderAll(); },
  slotCap() { return 1 + upLvl('slots'); },
  trayCap() { return 3 + upLvl('tray'); },
  selCup() { return this.tray.find(c => c.cid === this.sel) || null; },
  order(id) { const w = UI.view(); return w && id ? w.orders.find(o => o.id === id && o.st === 'wait') : null; },
  canPlay() { return UI.mode === 'game' && !UI.paused && !UI.spectating(); },
  msg(s, bad) { const el = $('prepMsg'); el.textContent = s; el.className = bad ? 'bad' : 'good'; this.msgT = 2.4; },

  setTarget(id) {
    if (!this.canPlay()) return;
    if (this.target === id) { this.target = 0; sendAct({ t: 'unclaim' }); }
    else { this.target = id; sendAct({ t: 'claim', o: id }); AU.pick(); }
    this.renderAll();
  },

  choose(g, v) {
    if (!this.canPlay()) return;
    const c = this.cup;
    const w = UI.view(); const sh = (w && w.shared) || {};
    if (g === 'b' && v === 'cham' && !sh.cham) { this.msg('Cham is locked: buy the recipe in Upgrades.', 1); return; }
    if (g === 'tk' && c.b !== 'teh') { this.msg('Only tea can be "tarik"-ed.', 1); return; }
    if (g === 'i' && c.tp !== 'ice') { this.msg('Choose Ais (iced) first.', 1); return; }
    if (!this.started) this.started = performance.now();
    if (g === 'b' && c.b && c.b !== v) { this.cup = fresh(); this.cup.b = v; this.started = performance.now(); sendAct({ t: 'waste' }); this.msg('Spilled the old base: -RM0.30', 1); AU.pour(0.3); }
    else if (g === 'tk') c.tk = c.tk ? 0 : 1;
    else c[g] = v;
    if (g === 'tp') { if (v === 'hot') c.i = 0; else if (!c.i) c.i = 0; AU.ice && v === 'ice' && AU.ice(); }
    if (g === 'i') AU.ice(); else if (g === 'b') AU.pour(0.35); else AU.pick();
    if (g === 'b' && v !== 'teh') c.tk = 0;
    // feedback against the targeted ticket
    const o = this.order(this.target);
    let fb = 0;
    if (o && !o.usual && !o.tourist) {
      const want = o.d;
      const key = g === 'tk' ? 'tk' : g;
      const val = g === 'tk' ? c.tk : c[g];
      const ok = key === 'tk' ? (want.tk ? 1 : 0) === val : want[key] === val;
      fb = ok ? 1 : -1;
      if (!ok) { this.msg(this.wrongMsg(g, want), 1); AU.bad(); } else this.msg('Correct for table ' + (o.table + 1), 0);
    }
    this.renderAll(g, v, fb);
  },
  wrongMsg(g, want) {
    const t = { b: 'Base should be ' + BASES[want.b].n, m: 'Milk should be ' + MILK_LABEL[want.m], tk: want.tk ? 'This one needs tarik' : 'No tarik for this one', s: 'Sugar should be ' + SUGARS[want.s], tp: 'Should be ' + (want.tp === 'ice' ? 'Ais (iced)' : 'Panas (hot)'), i: 'Ice should be ' + ICES[want.i] };
    return t[g] || 'Not what was ordered';
  },
  missing() {
    const c = this.cup, m = [];
    if (!c.b) m.push('base'); if (!c.m) m.push('milk'); if (c.s === null) m.push('sugar'); if (!c.tp) m.push('hot or iced'); if (c.tp === 'ice' && !c.i) m.push('ice level');
    return m;
  },
  brew() {
    if (!this.canPlay()) return;
    const miss = this.missing();
    if (miss.length) { this.msg('Still need: ' + miss.join(', '), 1); AU.bad(); $('cupBox').classList.remove('shake'); void $('cupBox').offsetWidth; $('cupBox').classList.add('shake'); return; }
    if (this.slots.length >= this.slotCap()) { this.msg('Jug busy: wait for the drink to finish brewing', 1); return; }
    const c = this.cup;
    const base = BASES[c.b].t + (c.tk ? 1.4 * (1 - 0.4 * upLvl('tarik')) : 0) + (c.tp === 'ice' ? 0.9 * (1 - 0.5 * upLvl('ice')) : 0);
    const dur = base * (1 - 0.15 * upLvl('brew'));
    const cid = 'c' + (++this.cidN) + Math.floor(Math.random() * 99);
    this.slots.push({ cid, d: Object.assign({}, c), code: encDrink(c), target: this.target, t: 0, dur });
    if (this.started) this.prep.push((performance.now() - this.started) / 1000 + dur);
    this.cup = fresh(); this.started = 0; this.target = 0;
    AU.pour(Math.min(1.2, dur * 0.5)); this.msg('Brewing...', 0);
    this.renderAll();
  },
  dump() {
    if (!this.canPlay()) return;
    if (this.cup.b) { sendAct({ t: 'waste' }); this.msg('Poured away: -RM0.30', 1); AU.pour(0.3); }
    this.cup = fresh(); this.started = 0; this.renderAll();
  },
  tick(dt) {
    if (this.msgT > 0) { this.msgT -= dt; if (this.msgT <= 0) $('prepMsg').textContent = ''; }
    let changed = false;
    for (const s of this.slots) {
      if (s.t < s.dur) { s.t += dt; changed = true; }
      if (s.t >= s.dur && this.tray.length < this.trayCap()) { s.done = 1; this.tray.push({ cid: s.cid, d: s.d, code: s.code, target: s.target }); AU.clink(1); changed = true; }
    }
    if (this.slots.some(s => s.done)) this.slots = this.slots.filter(s => !s.done);
    // drop targets that no longer exist
    if (this.target && !this.order(this.target)) { this.target = 0; changed = true; }
    // cups handed to staff that never came back with an answer (lost message)
    const now = performance.now();
    for (const c of this.out.slice()) if (now - c.at > 90000) { this.out.splice(this.out.indexOf(c), 1); this.tray.push(c); changed = true; }
    if (changed) this.renderSlots();
    this.slots.forEach(s => { const el = document.querySelector(`[data-slot="${s.cid}"] i`); if (el) el.style.width = Math.min(100, s.t / s.dur * 100) + '%'; });
  },
  clickTray(cid) {
    if (!this.canPlay()) return;
    const c = this.tray.find(c => c.cid === cid); if (!c) return;
    const o = this.order(c.target);
    if (o) { this.deliverTo(o.table, c); return; }
    this.sel = this.sel === cid ? '' : cid; AU.pick(); this.renderSlots(); UI.renderTickets(true);
  },
  bin(cid) {
    const i = this.tray.findIndex(c => c.cid === cid); if (i < 0) return;
    this.tray.splice(i, 1); if (this.sel === cid) this.sel = ''; sendAct({ t: 'waste' }); this.msg('Cup thrown away: -RM0.30', 1); this.renderSlots();
  },
  // "OK to serve": hand the cup to the drinks staff, who carry it to the table
  deliverTo(tb, cup) {
    const c = cup || this.selCup(); if (!c || !this.canPlay()) return;
    const i = this.tray.indexOf(c); if (i < 0) return;
    this.tray.splice(i, 1); this.sel = '';
    c.at = performance.now(); c.tb = tb; this.out.push(c);
    AU.clink(1);
    sendAct({ t: 'serve', tb, c: c.code, o: c.target || 0, cid: c.cid });
    this.msg('Staff is bringing it to table ' + (tb + 1), 0);
    this.renderSlots(); UI.renderTickets(true);
  },
  onResult(e) {
    if ((e.p | 0) !== NET.myIdx) return;
    const i = this.out.findIndex(c => c.cid === e.cid); if (i < 0) return;
    const c = this.out.splice(i, 1)[0];
    if (e.r === 'wasted') this.msg('Wrong drink: the customer sent it back. Make it again.', 1);
    else if (e.r === 'wrong' || e.r === 'noone') { this.tray.push(c); this.msg(e.r === 'noone' ? 'Nobody at that table was waiting. The cup is back on your tray.' : 'Wrong table! The cup is back on your tray.', 1); }
    this.renderSlots();
  },

  // ---------- rendering ----------
  renderAll(g, v, fb) {
    const c = this.cup;
    document.querySelectorAll('#ctrl [data-g]').forEach(b => {
      const gg = b.dataset.g, vv = b.dataset.v;
      let on = gg === 'tk' ? !!c.tk : String(c[gg]) === vv;
      b.classList.toggle('on', on);
      const w = UI.view(); const sh = (w && w.shared) || {};
      b.disabled = (gg === 'tk' && c.b !== 'teh') || (gg === 'i' && c.tp !== 'ice') || (gg === 'b' && vv === 'cham' && !sh.cham);
      if (g === gg && String(v) === vv && fb) { b.classList.remove('fb-good', 'fb-bad'); void b.offsetWidth; b.classList.add(fb > 0 ? 'fb-good' : 'fb-bad'); }
    });
    $('cupView').innerHTML = cupSVG(c, 1);
    $('cupName').textContent = c.b && c.m ? drinkTitle({ b: c.b, m: c.m, tk: c.tk, s: c.s === null ? 2 : c.s, tp: c.tp || 'hot', i: c.i }) : 'Empty cup';
    const o = this.order(this.target);
    $('tgtLine').innerHTML = o ? `Making for <b>Table ${o.table + 1}</b>` : 'Free pour: pick a ticket to aim at an order';
    this.renderSlots();
    UI.renderTickets(true);
  },
  renderSlots() {
    const sl = [];
    for (let i = 0; i < this.slotCap(); i++) {
      const s = this.slots[i];
      sl.push(s ? `<div class="slot busy" data-slot="${s.cid}">${cupSVG(s.d, 0.42)}<span>${esc(drinkTitle(s.d))}</span><b class="pg"><i></i></b></div>` : `<div class="slot"><span>Jug free</span></div>`);
    }
    $('slots').innerHTML = sl.join('');
    const tr = [];
    const cap = Math.max(this.trayCap(), this.tray.length);
    for (let i = 0; i < cap; i++) {
      const c = this.tray[i];
      if (!c) { tr.push('<div class="tcup empty"></div>'); continue; }
      const o = this.order(c.target);
      tr.push(`<div class="tcup ${c.cid === this.sel ? 'sel' : ''}"><button class="tc-main" data-cup="${c.cid}" aria-label="${o ? 'Serve to table ' + (o.table + 1) : 'Pick up'} ${esc(drinkTitle(c.d))}">${cupSVG(c.d, 0.5)}<span class="tn">${esc(drinkTitle(c.d))}</span><span class="tt ${o ? 'go' : ''}">${o ? 'Serve to T' + (o.table + 1) : c.target ? 'Order gone: pick table' : 'Pick a table'}</span></button><button class="bin" data-bin="${c.cid}" aria-label="Throw away">×</button></div>`);
    }
    $('tray').innerHTML = tr.join('');
    $('outList').innerHTML = this.out.length ? '<span>With staff:</span>' + this.out.map(c => `<em>${esc(drinkTitle(c.d))} → T${c.tb + 1}</em>`).join('') : '';
    $('trayNote').textContent = this.selCup() ? 'Now click its table in the shop, or its ticket' : this.tray.some(c => this.order(c.target)) ? 'Click a ready cup: staff will serve it' : this.tray.length ? 'Click the cup, then the table it is for' : '';
  }
};

// SVG cup for the station UI
function cupSVG(c, scale) {
  const col = liquidColour(c.b, c.m || 'none', c.tk);
  const W = 90, H = 100;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${Math.round(W * scale)}" height="${Math.round(H * scale)}" aria-hidden="true">`;
  if (c.tp === 'ice') {
    s += `<ellipse cx="45" cy="94" rx="24" ry="5" fill="rgba(0,0,0,.15)"/><path d="M24 14 H66 L62 92 H28 Z" fill="#e9f1f1" stroke="#9fb3b5" stroke-width="2"/>`;
    if (col) s += `<path d="M26 ${c.m ? 24 : 70} H64 L61 90 H29 Z" fill="${col}" class="liq"/>`;
    for (let k = 0; k < (c.i || 0) * 2; k++) s += `<rect x="${30 + (k % 3) * 10}" y="${28 + Math.floor(k / 3) * 12 + (k % 2) * 3}" width="9" height="9" rx="2" fill="rgba(255,255,255,.8)" stroke="rgba(160,200,210,.9)"/>`;
    s += `<path d="M66 26 q12 4 0 30" fill="none" stroke="#9fb3b5" stroke-width="3"/>`;
    if (c.b === 'limau') s += `<path d="M22 16 a10 10 0 0 0 20 0 z" fill="#8fc43a" stroke="#5f8f22"/>`;
  } else {
    s += `<ellipse cx="45" cy="90" rx="34" ry="8" fill="#f4f1ea" stroke="#4c8a6a" stroke-width="2"/>`;
    s += `<path d="M20 44 H70 L64 86 H26 Z" fill="#fbf8f0" stroke="#c9c2b0" stroke-width="2"/><path d="M20 47 H70" stroke="#4c8a6a" stroke-width="3"/>`;
    s += `<path d="M70 54 q14 2 2 22" fill="none" stroke="#e9e3d6" stroke-width="5"/>`;
    if (col) s += `<ellipse cx="45" cy="46" rx="23" ry="5" fill="${col}"/>`;
    if (col && c.tk) s += `<ellipse cx="45" cy="45" rx="19" ry="3.5" fill="#f3e3c8"/>`;
    if (c.tp === 'hot' && col) s += `<path d="M36 36 q4 -8 0 -16 M50 36 q4 -8 0 -16" stroke="rgba(150,130,110,.6)" stroke-width="2" fill="none"/>`;
  }
  if (c.s !== null && c.s !== undefined) { for (let k = 0; k < c.s; k++) s += `<rect x="${4 + k * 9}" y="4" width="7" height="7" rx="1.5" fill="#fffdf8" stroke="#bfae8c"/>`; if (c.s === 0) s += `<text x="4" y="12" font-size="9" font-weight="700" fill="#8a6d3b">kosong</text>`; }
  if (!c.b) s += `<text x="45" y="${c.tp === 'ice' ? 60 : 72}" text-anchor="middle" font-size="10" fill="#8a7b62">empty</text>`;
  return s + '</svg>';
}

function avatarSVG(L, size = 30) {

  else { s += `<circle cx="15" cy="13" r="7" fill="${L.skinC}"/>`; if (L.hair !== 'bald') s += `<path d="M8 12 a7 7 0 0 1 14 0 q-7 -3 -14 0z" fill="${hairC}"/>`; }
  if (L.helmet) s += `<path d="M7 11 a8 8 0 0 1 16 0z" fill="${L.helmet}"/>`;

  },
  shop() {

      <div class="btns"><button data-act="shopback" autofocus>Done</button></div>`);
  },
  friends(err) {

      <p class="lede">Up to 4 baristas share one counter. Everyone sees the same customers and orders; each player has their own drink station and tray.</p>

      ${err ? `<p class="warn">${esc(err)}</p>` : ''}
      <label class="fld">Your name<input id="nick" maxlength="14" value="${esc(SAVE.nick || '')}" placeholder="e.g. Mei Ling" ${pre ? '' : 'autofocus'}></label>
      <div class="mp"><div><h3>Host a kopitiam</h3><p>Get a room code to give your friends.</p><button class="big" data-act="host" ${avail ? '' : 'disabled'}>Host a room</button></div>
      <div><h3>Join a friend</h3><p>Type the code your host gave you.</p><input id="code" maxlength="10" value="${esc(pre)}" placeholder="room code" autocomplete="off" ${pre ? 'autofocus' : ''}><button class="big alt" data-act="join" ${avail ? '' : 'disabled'}>Join room</button></div></div>
      <div class="btns"><button data-act="title">Back</button></div>`);
  },
  netReady() { if (this.screen === 'friends' && this.mode === 'menu') this.friends(); },
  netError(m) { if (NET.mode !== 'solo') { netLeave(); this.mode = 'menu'; this.friends('Lost the connection to the room' + (m ? ': ' + m : '.')); } },
  renderLobby() {
    if (NET.mode !== 'host' || (S.w && S.w.ph === 'play' && this.mode === 'game')) return;

    this.lobbyHTML(NET.players, NET.full.length, NET.lobbySg, true);
  },
  clientLobby() {
    if (this.mode === 'game' && !(this.CW && this.CW.ph === 'end')) { this.mode = 'menu'; }
    if (this.screen === 'summary' && this.CW && this.CW.ph === 'end' && this.mode === 'menu' && this._sumHold && performance.now() - this._sumHold < 1500) return;
    this.mode = 'menu'; this.screen = 'lobby';
    const L = NET.lobby; if (!L) return;
    const full = L.full.includes(NET.myPeer);
    this.lobbyHTML(L.pl, L.full.length, L.sg, false, full);
  },
  lobbyHTML(pl, nFull, sg, isHost, full) {
    const slots = [0, 1, 2, 3].map(i => { const p = pl[i]; return p ? `<li style="--pc:${PCOL[p.col] || PCOL[0]}"><i></i><span class="pn"></span>${i === 0 ? '<em>host</em>' : ''}${p.peer === NET.myPeer ? '<em>you</em>' : ''}</li>` : '<li class="emptyslot"><i></i><span>Waiting for a barista...</span></li>'; }).join('');
    const stageSel = isHost ? `<div class="sgsel">${STAGES.map((st, i) => `<button data-act="mpstage" data-sg="${i}" class="${i === sg ? 'on' : ''}" ${i >= SAVE.unlocked ? 'disabled' : ''}>${i + 1}. ${st.name}</button>`).join('')}</div>` : `<p class="lede">Shift picked by the host: <b>${STAGES[sg].name}</b></p>`;
    this.show(`<p class="kicker">Room code</p><div class="code"><b>${esc(NET.code.toUpperCase())}</b><button data-act="copycode">Copy code</button></div>
      <p class="meta">${isHost ? 'Share this game from its Claude page (Share button) with up to 3 friends, then give them this code. Only people you invite can open it.' : full ? 'The room is full (4 baristas). You can watch the shift.' : 'You are in. Waiting for the host to open the counter.'}</p>
      <ul class="players">${slots}</ul>${nFull ? `<p class="meta">${nFull} more ${nFull > 1 ? 'people are' : 'person is'} watching (room is full).</p>` : ''}
      ${stageSel}
      <div class="btns"><button data-act="leave">Leave room</button><button data-act="shop">Upgrades</button>${isHost ? '<button class="big" data-act="mpstart" autofocus>Open the counter</button>' : ''}</div>`, 'lobby');
    // names are untrusted text: set with textContent
    const lis = $('ov').querySelectorAll('.players li:not(.emptyslot) .pn');
