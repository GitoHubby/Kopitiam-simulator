  },
  message(title, body) { this.mode = 'menu'; this.show(`<h2>${esc(title)}</h2><p class="lede">${esc(body)}</p><div class="btns"><button data-act="title" autofocus>Back to title</button></div>`); },
  pauseMenu() {
    if (NET.mode !== 'solo') { this.show(`<h2>Leave the shift?</h2><p class="lede">${NET.mode === 'host' ? 'You are the host: leaving closes the kopitiam for everyone.' : 'The others will carry on without you.'}</p><div class="btns"><button data-act="resume" autofocus>Keep serving</button><button data-act="leave">Leave room</button></div>`); return; }
    this.paused = true;
    this.show(`<h2>Paused</h2><p class="lede">The kopitiam waits for you. Take a sip.</p><div class="btns"><button class="big" data-act="resume" autofocus>Resume</button><button data-act="restart">Restart shift</button><button data-act="quit">Quit to title</button></div>`);
  },

  // ---------- game flow ----------
  enterGame() {
    this.mode = 'game'; this.paused = false; this.screen = 'game'; this.hide(); Station.reset(); this.lastTk = ''; R.sm = new Map(); setTimeout(resizeCanvas, 0);
    AU.init(); $('bPause').textContent = NET.mode === 'solo' ? 'Pause' : 'Leave';
    $('app').classList.add('ingame');
  },
  startSolo(sg) {
    if (NET.mode !== 'solo') netLeave();
    NET.mode = 'solo'; NET.myIdx = 0; NET.ep = 'e' + Date.now() % 1e7;
    S.w = newWorld(sg, [{ peer: '', nick: SAVE.nick || 'You', col: 0 }]); S.w.ep = NET.ep;
    this.enterGame();
    if (sg === 0) this.banner('Customers are coming in. Watch the ticket rail!');
  },
  startHost() {
    NET.ep = 'e' + Date.now() % 1e7; NET.myIdx = 0;
    NET.players = NET.players.filter(p => !p.gone); NET.players.forEach((p, i) => p.col = i);
    S.w = newWorld(NET.lobbySg, NET.players.map(p => ({ peer: p.peer, nick: p.nick, col: p.col }))); S.w.ep = NET.ep;
    NET.lastSeq = {}; for (const p of NET.nr.peers()) { const a = p.presence && p.presence.acts; if (Array.isArray(a)) NET.lastSeq[p.peer] = Math.max(0, ...a.map(x => (x && x.s) | 0)); }
    this.enterGame(); NET.lastPub = 0; hostPublishTick(performance.now() + 1000);
  },
  clientSnap(st) {
    const prevEp = this.CW && this.CW.ep;
    this.CW = worldFromSnap(st, this.CW);
    NET.myIdx = this.CW.players.findIndex(p => p.peer === NET.myPeer);
    if (this.CW.ph === 'play' && (this.mode !== 'game' || prevEp !== this.CW.ep)) this.enterGame();
    if (this.CW.ph === 'end' && this.endShown !== this.CW.ep && this.CW.result) this.onEnd(this.CW);
  },
  onEnd(w) {
    if (this.endShown === w.ep) return; this.endShown = w.ep;
    const r = w.result || {}; const mine = NET.mode === 'solo' ? null : (r.per || [])[NET.myIdx];
    let earn = NET.mode === 'solo' ? (r.rev + r.tips - r.waste) : mine ? +mine[3] : 0;
    earn = Math.round((earn || 0) * 100) / 100;
    if (!this.spectating()) {
      SAVE.wallet = Math.max(0, Math.round((SAVE.wallet + earn) * 100) / 100);
      const sg = r.sg | 0;
      SAVE.stars[sg] = Math.max(SAVE.stars[sg] || 0, r.stars | 0);
      if (r.stars >= 1) SAVE.unlocked = Math.min(STAGES.length, Math.max(SAVE.unlocked, sg + 2));
      if (sg === 0) SAVE.tut = 1;
      saveGame();
    }
    if (r.stars >= 2) AU.win(); else if (r.failed) AU.bad();
    this.summary(r, earn);
  },
  summary(r, earn) {
    this.mode = 'menu'; this.screen = 'summary'; this._sumHold = performance.now(); $('app').classList.remove('ingame');
    const prep = Station.prep.length ? (Station.prep.reduce((a, b) => a + b, 0) / Station.prep.length) : 0;
    const st = STAGES[r.sg | 0];
    const rows = [['Beverage orders', r.orders], ['Served perfectly', r.ok], ['Served, not quite right', r.minor], ['Wrong drinks', r.bad], ['Orders missed', r.missed],
      ['Beverage revenue', fmtRM(r.rev)], ['Tips', fmtRM(r.tips)], ['Wasted ingredients', r.waste > 0 ? '-' + fmtRM(r.waste) : fmtRM(0)], ['Customer satisfaction', r.sat + '%'],
      ['Avg wait per drink', (r.avgWait || 0).toFixed(1) + 's'], ['Your avg prep time', prep ? prep.toFixed(1) + 's' : '-'], ['Best streak', r.best]];
    let per = '';
    const pl = (NET.mode === 'solo' ? [] : (this.view() || {}).players) || [];
    if (pl.length > 1 && Array.isArray(r.per)) {
      per = `<table class="per"><thead><tr><th>Barista</th><th>Perfect</th><th>Off</th><th>Wrong</th><th>Earned</th></tr></thead><tbody>${pl.map((p, i) => { const q = r.per[i] || [0, 0, 0, 0]; return `<tr style="--pc:${PCOL[p.col]}"><td><i></i><span class="pn"></span></td><td>${q[0] | 0}</td><td>${q[1] | 0}</td><td>${q[2] | 0}</td><td>${fmtRM(+q[3] || 0)}</td></tr>`; }).join('')}</tbody></table>`;
    }
    const title = r.failed ? 'Satisfaction hit zero. The towkay closed the counter early.' : r.stars === 3 ? 'Steady hands. The uncles are impressed.' : r.stars === 2 ? 'Good shift! A few hiccups.' : r.stars === 1 ? 'You survived the shift.' : 'Rough shift. Try again?';
    const btns = NET.mode === 'solo'
      ? `<button data-act="retry">Replay shift</button><button data-act="shop">Upgrades</button>${(r.sg | 0) < STAGES.length - 1 && SAVE.unlocked > (r.sg | 0) + 1 ? '<button class="big" data-act="next" autofocus>Next shift</button>' : '<button class="big" data-act="solo" autofocus>Shifts</button>'}`
      : NET.mode === 'host' ? `<button data-act="leave">Close room</button><button class="big" data-act="lobby" autofocus>Back to lobby</button>` : `<button data-act="leave">Leave room</button><span class="meta">Waiting for the host...</span>`;
    this.show(`<p class="kicker">${esc(st.name)} · shift report</p><div class="bigstars">${starsHTML(r.stars | 0, 1)}</div><h2>${title}</h2>
      <dl class="stats">${rows.map(x => `<div><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join('')}</dl>${per}
      <p class="lede">${this.spectating() ? 'You watched this shift.' : `You take home <b>${fmtRM(earn)}</b>. Savings now ${fmtRM(SAVE.wallet)}.`}</p>
      <div class="btns">${btns}</div>`, 'summary');
    $('ov').querySelectorAll('.per .pn').forEach((el, i) => el.textContent = pl[i] ? pl[i].nick : '');
  },
  banner(s) { const b = $('banner'); b.textContent = s; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); },

  // ---------- tickets ----------
  renderTickets(force) {
    const w = this.view(); const rail = $('rail');
    if (!w || this.mode !== 'game') { if (rail.innerHTML) rail.innerHTML = ''; return; }
    const os = w.orders.filter(o => o.st === 'wait').sort((a, b) => a.id - b.id);
    const key = os.map(o => o.id + ':' + o.cl).join(',') + '|' + Station.sel + '|' + Station.target + '|' + Station.slots.map(s => s.target).join('.') + Station.tray.map(c => c.target).join('.');
    $('railCount').textContent = os.length ? os.length + ' waiting' : '';
    if (key !== this.lastTk || force) {
      this.lastTk = key;
      if (!os.length) rail.innerHTML = `<p class="empty">No drink orders yet. Customers order food first; only some will want a drink.</p>`;
      else rail.innerHTML = os.map(o => ticketHTML(o, w)).join('');
      rail.querySelectorAll('[data-pn]').forEach(el => { const p = w.players[+el.dataset.pn]; el.textContent = p ? p.nick : ''; });
    }
    for (const o of os) { const el = rail.querySelector(`[data-o="${o.id}"] .pat i`); if (el) { el.style.width = (o.f * 100) + '%'; el.className = o.f > 0.5 ? '' : o.f > 0.25 ? 'mid' : 'low'; } }
  },
  hud(w) {
    if (!w) return;
    const st = STAGES[w.sg]; const h = clockHour(w); const hh = Math.floor(h), mm = Math.floor((h % 1) * 60);
    $('hShift').textContent = (this.mode === 'game' ? 'Shift ' + (w.sg + 1) + ': ' + st.name : 'Kedai Kopi Sinar Pagi');
    $('hClock').textContent = (hh > 12 ? hh - 12 : hh) + ':' + String(mm).padStart(2, '0') + (hh < 12 ? ' am' : ' pm');
    $('hMoney').textContent = fmtRM(w.rev + w.tips);
    const sb = $('hSat'); sb.style.width = w.sat + '%'; sb.className = w.sat > 60 ? '' : w.sat > 30 ? 'mid' : 'low';
    $('hSatTxt').textContent = Math.round(w.sat) + '%';
    $('hQueue').textContent = w.orders.filter(o => o.st === 'wait').length;
    $('hWx').textContent = wxLabel(w.weather) + (w.players && w.players.length > 1 ? ' · ' + w.players.length + ' baristas' : '');
  },
  hint() {
    const el = $('hint');
    const w = this.view();
    if (this.mode !== 'game' || !w || w.sg !== 0 || SAVE.tut >= 1 && NET.mode !== 'solo' || this.spectating()) { el.hidden = true; return; }
    if (SAVE.tut >= 1) { el.hidden = true; return; }
    let s = '';
    const waiting = w.orders.filter(o => o.st === 'wait');
    if (Station.selCup()) s = 'Now click the table this drink is for (in the shop, or its ticket).';
    else if (Station.tray.length) s = 'A drink is ready! Click the cup on the tray: the drinks staff will carry it to the customer.';
    else if (Station.out.length && !waiting.length) s = 'Your staff is serving the drink. Watch them walk it to the table.';
    else if (Station.slots.length) s = 'Brewing... you can start the next drink while you wait.';
    else if (Station.cup.b || Station.target) { const m = Station.missing(); s = m.length ? 'Build the drink. Still need: ' + m.join(', ') + '. Then press Bancuh!' : 'All set. Press Bancuh! to brew it.'; }
    else if (waiting.length) s = 'A drink order came back from the tables. Click its ticket to start making it.';
    else if (w.runners.some(r => r.st === 'asking' || r.st === 'toTable' || r.st === 'toCounter')) s = 'Your staff is at a table asking "Minum apa?". The order lands on your rail when they come back.';
    else s = 'Customers come in, sit, and queue at the food stalls. Your drinks staff will go and take their drink orders.';
    el.hidden = false; el.textContent = s;
  },
  tooltip(e) {
    const tip = $('tip'), w = this.view();
    if (!w || !R.mouse) { tip.hidden = true; return; }
    const i = R.hover; const pid = i >= 0 ? w.tableParty[i] : -1; const p = pid >= 0 ? w.parties.find(p => p.id === pid) : null;
    if (!p) { tip.hidden = true; return; }
    const os = w.orders.filter(o => o.table === i && o.st === 'wait');
    const mood = ['Happy', 'Fine', 'Annoyed', 'Angry'][Math.max(...p.members.map(m => m.mood))];
    const ms = p.members;
    const stLabel = p.drink === 'req' ? 'Waiting for drinks staff' : p.drink === 'asking' ? 'Ordering drinks' : ms.some(m => m.pose === 'order') ? 'Ordering at a food stall' : ms.some(m => m.pose === 'walk') ? 'Walking around' : ms.some(m => m.food === 2) ? 'Eating' : ms.every(m => m.food === 3) ? 'Finishing up' : ms.some(m => m.food === 1) ? 'Waiting for food' : 'Sitting down';
    const foods = [...new Set(ms.map(m => m.stall).filter(i => i >= 0).map(i => STALLS[i].n))].join(', ');
    tip.innerHTML = `<b>Table ${i + 1}</b> · ${esc(TYPES[p.type].name)}${p.members.length > 1 ? ' group of ' + p.members.length : ''}<br><span>${esc(PERSONALITIES[p.pers].n)} · ${mood} · ${stLabel}</span>${foods ? `<br><span>Food: ${esc(foods)}</span>` : ''}` +
      (os.length ? os.map(o => `<div class="tl">${o.usual ? 'The usual' : o.tourist ? 'Tourist order' : esc(drinkTitle(o.d))} <em>${Math.round(o.f * 100)}% patience${o.cl >= 0 && w.players[o.cl] ? ' · being made' : ''}</em></div>`).join('') : '<div class="tl"><em>No drink waiting</em></div>');
    tip.hidden = false;
    tip.style.left = Math.min(G.W - 220, R.mouse.cx + 14) + 'px'; tip.style.top = Math.max(0, R.mouse.cy - 10) + 'px';
  },
  flashRail() { const r = $('railSec'); r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); }
};

function wxLabel(x) { return x === 'rain' ? 'Rainy' : x === 'hot' ? 'Hot and sunny' : 'Clear morning'; }
function starsHTML(n, big) { return [0, 1, 2].map(i => `<svg viewBox="0 0 24 24" width="${big ? 44 : 16}" height="${big ? 44 : 16}" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="${i < n ? '#f0b429' : 'rgba(120,100,70,.25)'}" stroke="${i < n ? '#a8741a' : 'none'}"/></svg>`).join('') + `<span class="sr">${n} of 3 stars</span>`; }

function ticketHTML(o, w) {
  const m = findMember(w, o.mid); const L = m ? m.look : lookFor(o.type, 1, -1, 0);
  const pl = o.cl >= 0 && w.players[o.cl];
  const mine = Station.target === o.id, brewing = Station.slots.some(s => s.target === o.id) || Station.tray.some(c => c.target === o.id);
  let name, body = '', tag = '';
  if (o.reg >= 0 && !o.usual) { SAVE.regs[o.reg] = 1; }
  if (o.usual) { name = `${REGULARS[o.reg].n}: "Yang biasa!"`; body = '<p class="note">His usual. Forgot? Check Buku 555.</p>'; tag = 'Regular'; }
  else if (o.tourist) { name = `"${drinkEnglish(o.d)}"`; body = '<p class="note">Tourist order: work out the kopitiam name.</p>'; tag = PERSONALITIES[o.pers].n; }
  else {
    name = drinkTitle(o.d);
    body = `<div class="chips">${drinkChips(o.d).map(c => `<span class="chip ${c[0]}">${c[1]}</span>`).join('')}</div>`;
    if (o.reg >= 0) { tag = 'New regular'; body += `<p class="note">${REGULARS[o.reg].n}. Remember this: next time it's just "the usual".</p>`; }
    else tag = PERSONALITIES[o.pers].n;
  }
  const status = brewing ? '<span class="stt">brewing</span>' : pl ? `<span class="stt" style="--pc:${PCOL[pl.col]}">by <span data-pn="${o.cl}"></span></span>` : '';
  return `<button class="tk ${Station.selCup() ? 'serve' : ''} ${mine ? 'mine' : ''} ${pl && !mine ? 'claimed' : ''}" data-o="${o.id}" style="${pl ? '--pc:' + PCOL[pl.col] : ''}">
    <span class="tk-top"><span class="tbl">T${o.table + 1}</span>${avatarSVG(L, 26)}<span class="who">${esc(TYPES[o.type].name)}<em>${esc(tag)}</em></span></span>
    <span class="nm">${esc(name)}</span>${body}<span class="pat"><i></i></span>${status}</button>`;
}

function renderBook() {
  const known = REGULARS.map((r, i) => SAVE.regs[i] ? r : null).filter(Boolean);
  $('book').innerHTML = `<h3>Buku 555: regulars</h3>` + (known.length ? '<ul>' + known.map(r => `<li><b>${esc(r.n)}</b> ${esc(drinkTitle(r.d))} <span>${drinkChips(r.d).map(c => c[1]).join(', ')}</span></li>`).join('') + '</ul>' : '<p>No regulars yet. Uncles who come back will expect you to remember their usual.</p>');
}

// ---------- input ----------
function bindInput() {
  $('ov').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act; AU.init();
    const nickIn = () => { const v = (($('nick') && $('nick').value) || '').trim().slice(0, 14) || 'Barista'; SAVE.nick = v; saveGame(); return v; };
    if (a === 'title') UI.title();
    else if (a === 'solo') UI.stages();
    else if (a === 'friends') UI.friends();
    else if (a === 'how') UI.how();
    else if (a === 'brief') UI.brief(+b.dataset.sg);
    else if (a === 'start') UI.startSolo(UI.sg | 0);
    else if (a === 'retry') UI.brief(UI.sg | 0);
    else if (a === 'next') UI.brief(Math.min(STAGES.length - 1, (UI.sg | 0) + 1));
    else if (a === 'shop') { UI.back = UI.screen; UI.shop(); }
    else if (a === 'shopback') { const s = UI.back; if (s === 'lobby') { NET.mode === 'host' ? (UI.screen = 'lobby', UI.renderLobby()) : UI.clientLobby(); } else if (s === 'stages') UI.stages(); else if (s === 'summary') UI.stages(); else UI.title(); }
    else if (a === 'buy') { const u = UPGRADES.find(u => u.id === b.dataset.id); const lv = upLvl(u.id); if (lv < u.max && SAVE.wallet >= u.cost[lv]) { SAVE.wallet = Math.round((SAVE.wallet - u.cost[lv]) * 100) / 100; SAVE.up[u.id] = lv + 1; saveGame(); AU.coin(); UI.shop(); } }
    else if (a === 'reset') { if (UI.resetArm) { localStorage && (() => { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } })(); Object.assign(SAVE, { wallet: 0, up: {}, stars: [0, 0, 0, 0, 0], unlocked: 1, regs: {}, tut: 0 }); UI.resetArm = 0; } else { UI.resetArm = 1; setTimeout(() => { UI.resetArm = 0; }, 4000); } UI.title(); }
    else if (a === 'resume') { UI.paused = false; UI.hide(); }
    else if (a === 'restart') UI.startSolo(S.w ? S.w.sg : 0);
    else if (a === 'quit') { S.w = null; UI.title(); $('app').classList.remove('ingame'); }
    else if (a === 'host') { const n = nickIn(); b.disabled = true; try { await hostRoom(n); UI.screen = 'lobby'; UI.renderLobby(); } catch (err) { UI.friends((err && err.message) || 'Could not open a room.'); } }
    else if (a === 'join') { const n = nickIn(); const code = ($('code').value || '').trim(); b.disabled = true; try { await joinRoom(code, n); UI.screen = 'lobby'; UI.show(`<h2>Joining ${esc(NET.code.toUpperCase())}...</h2><p class="lede">Looking for the host.</p><div class="btns"><button data-act="leave">Cancel</button></div>`); } catch (err) { UI.friends((err && err.message) || 'Could not join that room.'); } }
    else if (a === 'mpstage') { NET.lobbySg = +b.dataset.sg; publishLobby(); UI.renderLobby(); }
    else if (a === 'mpstart') UI.startHost();
    else if (a === 'lobby') { S.w = null; UI.screen = 'lobby'; UI.mode = 'menu'; NET.players = NET.players.filter(p => !p.gone); NET.players.forEach((p, i) => p.col = i); NET.full = []; onPeersHost({ peers: NET.nr.peers(), left: [], joined: [], updated: [] }); publishLobby(); UI.renderLobby(); }
    else if (a === 'leave') { await netLeave(); S.w = null; UI.CW = null; $('app').classList.remove('ingame'); UI.title(); }
    else if (a === 'copycode') { try { await navigator.clipboard.writeText(NET.code.toUpperCase()); b.textContent = 'Copied'; } catch (err) { b.textContent = 'Select and copy it'; } }
  });
  $('ctrl').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; const g = b.dataset.g; let v = b.dataset.v; if (g === 's' || g === 'i') v = +v; Station.choose(g, v); });
  $('bBrew').addEventListener('click', () => Station.brew());
  $('bDump').addEventListener('click', () => Station.dump());
  $('rail').addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (!b) return; const w = UI.view(); const o = w && w.orders.find(o => o.id === +b.dataset.o); if (Station.selCup() && o) Station.deliverTo(o.table); else Station.setTarget(+b.dataset.o); });
  $('tray').addEventListener('click', e => { const b = e.target.closest('[data-bin]'); if (b) return Station.bin(b.dataset.bin); const c = e.target.closest('[data-cup]'); if (c) Station.clickTray(c.dataset.cup); });
  $('bSound').addEventListener('click', () => { AU.init(); AU.setOn(!SAVE.sound); $('bSound').textContent = SAVE.sound ? 'Sound on' : 'Sound off'; $('bSound').setAttribute('aria-pressed', SAVE.sound ? 'true' : 'false'); });
  $('bPause').addEventListener('click', () => { if (UI.mode === 'game') UI.pauseMenu(); });
  $('bBook').addEventListener('click', () => { const b = $('book'); b.hidden = !b.hidden; if (!b.hidden) renderBook(); $('bBook').setAttribute('aria-expanded', b.hidden ? 'false' : 'true'); });
  // 3D view: drag to turn the camera, click a table to serve the selected cup or aim at its order
  const cv = $('cv'); let drag = null;
  const rel = e => { const r = cv.getBoundingClientRect(); return { cx: e.clientX - r.left, cy: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, az: G.cam.az, pol: G.cam.pol, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (err) { } });
  cv.addEventListener('pointermove', e => {
    const p = rel(e); R.mouse = p;
    if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 6) drag.moved = true; if (drag.moved) { G.camT = null; G.cam.az = clamp(drag.az - dx * 0.006, -1.2, 1.2); G.cam.pol = clamp(drag.pol - dy * 0.005, 0.2, 1.15); document.querySelectorAll('#camBtns button').forEach(b => b.classList.remove('on')); } return; }
    R.hover = tableAtScreen(p.cx, p.cy); cv.style.cursor = R.hover >= 0 && UI.mode === 'game' ? 'pointer' : 'grab';
  });
  cv.addEventListener('pointerleave', () => { R.mouse = null; R.hover = -1; $('tip').hidden = true; });
  cv.addEventListener('pointerup', e => {
    const d = drag; drag = null; if (!d || d.moved) return;
    if (UI.mode !== 'game') return; AU.init();
    const p = rel(e); const t = tableAtScreen(p.cx, p.cy); if (t < 0) return;
    if (Station.selCup()) Station.deliverTo(t);
    else { const w = UI.view(); const o = w && w.orders.filter(o => o.table === t && o.st === 'wait').sort((a, b) => a.id - b.id)[0]; if (o && Station.target !== o.id) Station.setTarget(o.id); }
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); if (!G.camT) G.camT = null; G.cam.dist = clamp(G.cam.dist + e.deltaY * 0.01, 14, 36); if (G.camT) G.camT.dist = G.cam.dist; }, { passive: false });
  $('camBtns').addEventListener('click', e => { const b = e.target.closest('[data-cam]'); if (b) setCam(b.dataset.cam); });
  const KEYS = { '1': ['b', 'kopi'], '2': ['b', 'teh'], '3': ['b', 'milo'], '4': ['b', 'limau'], '5': ['b', 'cham'], q: ['m', 'none'], w: ['m', 'pekat'], e: ['m', 'cair'], r: ['tk', 1], a: ['s', 0], s: ['s', 1], d: ['s', 2], f: ['s', 3], z: ['tp', 'hot'], x: ['tp', 'ice'], c: ['i', 1], v: ['i', 2], b: ['i', 3] };
  window.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) { if (e.key === 'Enter') { const b = $('ov').querySelector(e.target.id === 'code' ? '[data-act="join"]' : '[data-act="host"]'); if (b) b.click(); } return; }
    if (UI.mode !== 'game') return;
    const k = e.key.toLowerCase();
    if (k === 'escape') { if (Station.sel) { Station.sel = ''; Station.renderSlots(); } else if (!$('ov').hidden) { if (UI.paused || NET.mode !== 'solo') { UI.paused = false; UI.hide(); } } else UI.pauseMenu(); return; }
    if (!$('ov').hidden) return;
    if (Station.selCup() && /^[0-9]$/.test(k)) { Station.deliverTo(k === '0' ? 9 : +k - 1); e.preventDefault(); return; }
    if (k === ' ' || k === 'enter') { if (e.target.closest('button') && k === 'enter') return; Station.brew(); e.preventDefault(); return; }
    if (k === 'backspace') { Station.dump(); e.preventDefault(); return; }
    if (k === 'g') { const c = Station.tray[0]; if (c) Station.clickTray(c.cid); return; }
    if (KEYS[k]) { Station.choose(KEYS[k][0], KEYS[k][1]); e.preventDefault(); }
  });
  window.addEventListener('resize', () => resizeCanvas());
}

// ---------- main loop ----------
let _last = performance.now(), _sec = 0;
function frame(now) {
  const raw = Math.min(0.25, Math.max(0, (now - _last) / 1000)); _last = now; _lastFrameAt = performance.now();
  const dt = Math.min(0.1, raw);
  try {
    // fixed sub-steps so game time keeps pace with real time even at low frame rates
    if (UI.mode === 'game' && NET.mode !== 'client' && S.w && !UI.paused) { let left = raw; while (left > 1e-4) { const d = Math.min(0.05, left); left -= d; stepWorld(S.w, d); } }
    if (UI.mode !== 'game') {
      if (!UI.demo || UI.demo.ph !== 'play') { UI.demo = newWorld(1, [{ peer: '', nick: 'Staff', col: 0 }]); UI.demo.demo = 1; UI.demo.ep = 'demo' + now; UI.demo.spawnT = 0.5; }
      stepWorld(UI.demo, dt);
      for (const o of UI.demo.orders) { if (o.st !== 'wait' || o.srv) continue; o.auto = o.auto || rnd(4, 10); if (UI.demo.t - o.t0 > o.auto) hostAction(UI.demo, 0, { t: 'serve', tb: o.table, c: o.code, o: o.id, cid: '' }); }
    }
    if (NET.mode === 'host') hostPublishTick(now);
    const w = UI.view();
    if (UI.mode === 'game' && !UI.paused) Station.tick(raw);
    processEvents(w, UI.mode !== 'game');
    try { render(w, UI.paused ? 0 : dt); } catch (err) { console.error(err); }
    UI.hud(w);
    if (UI.mode === 'game') UI.renderTickets();
    _sec += dt;
    if (_sec > 0.25) {
      _sec = 0; UI.hint(); if (R.mouse && UI.mode === 'game') UI.tooltip(); else $('tip').hidden = true;
      if (NET.mode === 'client' && NET.nr) {
        const hp = NET.nr.peers().find(p => !p.sameTab && p.presence && p.presence.role === 'host');
        if (hp) NET.lastHostSeen = now;
        else if (now - NET.lastHostSeen > 9000) { const had = !!NET.hostPeer; netLeave(); S.w = null; UI.CW = null; $('app').classList.remove('ingame'); UI.message(had ? 'The host closed the kopitiam' : 'No host found', had ? 'The host left the room, so the shift has ended.' : 'Nobody is hosting a room with that code. Check the code with your host and try again.'); }
      }
    }
    AU.ambience(UI.mode === 'game' && !UI.paused, w && w.weather === 'rain');
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

// Background tabs pause requestAnimationFrame. Keep the shared shift alive with a timer:
// the host keeps simulating and publishing; guests keep their brewing timers going.
let _lastFrameAt = performance.now();
setInterval(() => {
  const now = performance.now();
  if (now - _lastFrameAt < 400) return;
  let dt = Math.min(2, (now - _lastFrameAt) / 1000); _lastFrameAt = now;
  try {
    while (dt > 0) { const d = Math.min(0.05, dt); dt -= d;
      if (UI.mode === 'game' && NET.mode !== 'client' && S.w && !UI.paused) stepWorld(S.w, d);
      if (UI.mode === 'game' && !UI.paused) Station.tick(d); }
    if (NET.mode === 'host') hostPublishTick(now);
    processEvents(UI.view(), UI.mode !== 'game');
  } catch (e) { console.error(e); }
}, 250);

function boot() {
  // make sure the signboard fonts are ready before painting 3D textures
  const fl = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('64px "Alfa Slab One"'), document.fonts.load('800 32px "Baloo 2"')]).catch(() => { }) : Promise.resolve();
  Promise.race([fl, new Promise(r => setTimeout(r, 1800))]).then(boot2);
}
function boot2() {
  loadSave();
  if (!SAVE.regs) SAVE.regs = {};
  initRender(); bindInput(); setCam('front');
  $('bSound').textContent = SAVE.sound ? 'Sound on' : 'Sound off';
  Station.renderAll();
  if (/^#join-/.test(location.hash)) UI.friends(); else UI.title();
  requestAnimationFrame(t => { _last = t; frame(t); });
  netInit();
  if (window.__KOPI_DEBUG) window.__kopi = { S, UI, Station, NET, R, G, stepWorld, hostAction, TABLES, SAVE, snapshot };
}
boot();

}
</script>
